", "choices": ["北緯37度", "北緯23度", "北緯45度", "北緯60度"], "num": "", "img": "i2", "kimg": "i1", "ar": 1.767}, {"q": "20世紀後半にアメリカ合衆国の南部で新しい産業が発達した理由を答えよ。", "a": "土地が安く手に入り、労働力が豊富だったから。", "r": "", "k": "新しい産業が発達したのは、北緯37度より南に広がるサンベルトと呼ばれる地域である。ここが選ばれたのは、気候が温暖で、土地が安く手に入り、労働力が豊富だったからである。中でもサンフランシスコ近郊のシリコンバレーでは、ICT関連産業がさかんになった。鉄鉱石や石炭、五大湖の水運は、古くからの五大湖周辺の工業が発達した理由で、南部にあてはまるものではない。", "choices": ["土地が安く手に入り、労働力が豊富だったから。", "鉄鉱石や石炭の産出量が全国で最も多かったから。", "五大湖の水運を使って原料を安く運べたから。", "冬の寒さがきびしく、農業に向かない土地だったから。"], "num": "", "img": "", "kimg": "i1"}, {"q": "地図中のbが指す都市を何というか。", "a": "サンフランシスコ", "r": "さんふらんしすこ", "k": "サンフランシスコは、アメリカ合衆国の西海岸にある都市である。その近郊のシリコンバレーには、コンピューターやインターネットに関連した企業（きぎょう）が多く集まっている。同じ西海岸でも、シアトルやロサンゼルスは航空機産業がさかんな都市である。", "choices": ["サンフランシスコ", "シアトル", "ロサンゼルス", "デトロイト"], "num": "b", "img": "i3", "kimg": "i1", "ar": 1.489}, {"q": "地図中のbの都市の近郊にある、高度な技術を用いる企業が多く集まる地域を何というか。", "a": "シリコンバレー", "r": "しりこんばれー", "k": "地図中のbはサンフランシスコで、その近郊に広がるせまい地域がシリコンバレーである。コンピューターやインターネットに関連したICT関連産業がさかんで、高度な技術を用いる企業が多く集まっている。北緯37度以南に広がるサンベルトの中の一部の地域なので、サンベルト全体とは範囲（はんい）がちがう。", "choices": ["シリコンバレー", "サンベルト", "プレーリー", "五大湖沿岸"], "num": "", "img": "i3", "kimg": "i1", "ar": 1.489}, {"q": "気候が温暖で、土地が安く労働力が豊富なことから工業が発達した地域を何というか。", "a": "サンベルト", "r": "さんべると", "k": "サンベルトで発達したのは、航空宇宙産業やコンピューター関連産業、バイオテクノロジーなどの先端技術産業である。北緯37度より南に広がる地域で、20世紀後半に大西洋岸や五大湖沿岸（えんがん）から工業の中心がここへ移った。気候が温暖で土地が安く手に入り、労働力が豊富だったことがその理由である。シリコンバレーはその中の一部の地域をさす。", "choices": ["サンベルト", "シリコンバレー", "プレーリー", "グレートプレーンズ"], "num": "", "img": "", "kimg": "i1"}, {"q": "20世紀後半に大西洋岸や五大湖沿岸の工業が停滞した理由を答えよ。", "a": "日本やドイツの鉄鋼や自動車との競争が厳しくなったから。", "r": "", "k": "20世紀後半、日本やドイツなどで生産された鉄鋼や自動車がアメリカへ輸出されるようになり、きびしい競争の中で大西洋岸や五大湖沿岸の工業は停滞した。そこでアメリカ合衆国は、先端技術産業に力をそそぐようになった。", "choices": ["日本やドイツの鉄鋼や自動車との競争が厳しくなったから。", "近くでとれる鉄鉱石や石炭の産出量が減り、原料が不足したから。", "五大湖の水運が使えなくなり、船で運べなくなったから。", "温暖な気候を求めて工場で働く人がいなくなったから。"], "num": "", "img": "", "kimg": "i1"}, {"q": "20世紀後半、鉄鋼や自動車などに代わってアメリカ合衆国が力をそそぐようになった産業を何というか。", "a": "先端技術産業", "r": "せんたんぎじゅつさんぎょう", "k": "先端技術産業は、航空宇宙産業やコンピューター関連産業、バイオテクノロジーなどの高度な技術を使う産業である。20世紀後半、鉄鋼や自動車の競争がきびしくなったアメリカ合衆国が力をそそぐようになり、おもにサンベルトで発達した。", "choices": ["先端技術産業", "鉄鋼業", "自動車工業", "繊維工業"], "num": "", "img": "", "kimg": "i1"}], "point": {"title": "サンベルトとシリコンバレー", "icon": "ti-world", "text": "20世紀後半、大西洋岸や五大湖沿岸の工業は、日本やドイツとの競争で勢いを失った。かわって伸びたのが<span class=\"bl\" data-a=\"北緯37度\" data-c=\"北緯37度|北緯23度|北緯45度\"><span class=\"gh\">北緯37度<span class=\"yomi\">（ほくいさんじゅうななど）</span></span><span class=\"q\">？</span></span>より南の<span class=\"bl\" data-a=\"サンベルト\" data-c=\"サンベルト|シリコンバレー|サンフランシスコ\"><span class=\"gh\">サンベルト<span class=\"yomi\">（さんべると）</span></span><span class=\"q\">？</span></span>。土地が安く、労働力が豊富だったからだ。西海岸のサンフランシスコ<span class=\"yomi\">（さんふらんしすこ）</span>近郊には<span class=\"bl\" data-a=\"シリコンバレー\" data-c=\"シリコンバレー|サンベルト|デトロイト\"><span class=\"gh\">シリコンバレー<span class=\"yomi\">（しりこんばれー）</span></span><span class=\"q\">？</span></span>ができ、ICT関連産業<span class=\"yomi\">（あいしーてぃーかんれんさんぎょう）</span>や先端技術産業<span class=\"yomi\">（せんたんぎじゅつさんぎょう）</span>が集まった。", "n": 10, "img": "i1"}}, {"ptitle": "中央部の低地", "mtitle": "FD 中学地理 中2 近畿", "kimg": "i4", "words": [{"q": "地形に注目した近畿地方の地域区分を答えよ。", "a": "北部・中央部・南部", "r": "ほくぶ・ちゅうおうぶ・なんぶ", "k": "中央部には低地が広がり、その北側と南側は山地になっている。この地形のちがいから、近畿地方は北部・中央部・南部の三つに分けられる。低地には湖や川のほか、盆地や平野も見られる。", "choices": ["北部・中央部・南部", "東部・中央部・西部", "北部・東部・南部", "西部・中央部・東部"], "num": "", "img": "", "kimg": "i4"}, {"q": "近畿地方で、盆地や平野が広がっている地域を答えよ。", "a": "中央部", "r": "ちゅうおうぶ", "k": "近畿地方の中央部は、北側と南側を山地にはさまれている。その間には低地が広がっていて、盆地や平野がいくつも見られる。この低地には、日本最大の湖や大きな川もあり、水にめぐまれている。", "choices": ["中央部", "北部", "南部", "東部"], "num": "", "img": "", "kimg": "i4"}, {"q": "地図中のAが指す湖を何というか。", "a": "琵琶湖", "r": "びわこ", "k": "琵琶湖（びわこ）があるのは、近畿地方の低地で、日本最大の湖である。湖から流れ出た水は淀川（よどがわ）となり、大阪湾にそそいでいる。まわりの低地には、京都盆地（きょうとぼんち）などの盆地や大阪平野などの平野も広がる。", "choices": ["琵琶湖", "霞ヶ浦", "浜名湖", "十和田湖"], "num": "A", "img": "i5", "kimg": "i4", "ar": 0.97}, {"q": "地図中のBが指す川を何というか。", "a": "淀川", "r": "よどがわ", "k": "淀川（よどがわ）は、近畿地方に広がる低地を流れている大きな川である。上流にある日本最大の湖から流れ出た水が、この川に集まってくる。川の下流には広い平野が広がり、多くの人が生活している。", "choices": ["淀川", "木曽川", "吉野川", "利根川"], "num": "B", "img": "i5", "kimg": "i4", "ar": 0.97}, {"q": "地図中のCが指す盆地を何というか。", "a": "京都盆地", "r": "きょうとぼんち", "k": "京都盆地（きょうとぼんち）は、近畿地方の低地に広がる盆地の一つである。同じ低地には大阪平野や播磨（はりま）平野などの平野も広がっている。この低地には現在、京都市などの大きな都市がいくつも集まっている。", "choices": ["京都盆地", "奈良盆地", "甲府盆地", "松本盆地"], "num": "C", "img": "i5", "kimg": "i4", "ar": 0.97}, {"q": "地図中のEが指す平野を何というか。", "a": "大阪平野", "r": "おおさかへいや", "k": "大阪平野が広がっているのは、近畿地方の低地である。同じ低地には播磨（はりま）平野もあり、盆地とともに低地をつくっている。今ではこの低地に、京都・大阪・神戸といった大都市が集まっている。", "choices": ["大阪平野", "播磨平野", "濃尾平野", "筑紫平野"], "num": "E", "img": "i5", "kimg": "i4", "ar": 0.97}, {"q": "地図中のDが指す盆地を何というか。", "a": "奈良盆地", "r": "ならぼんち", "k": "奈良盆地が広がっているのは、近畿地方の低地の一部である。同じ低地には京都盆地（きょうとぼんち）もあり、大阪平野などの平野も広がる。この低地は、古くから人々が生活する場となってきた土地である。", "choices": ["奈良盆地", "京都盆地", "甲府盆地", "長野盆地"], "num": "D", "img": "i5", "kimg": "i4", "ar": 0.97}, {"q": "地図中のHが指す湾を何というか。", "a": "大阪湾", "r": "おおさかわん", "k": "大阪湾には、近畿地方の低地を流れる淀川（よどがわ）がそそいでいる。この低地には日本最大の琵琶湖（びわこ）もあり、水に関わる地形が多く見られる。まわりには盆地や平野も広がり、人々の生活の場となってきた。", "choices": ["大阪湾", "若狭湾", "伊勢湾", "東京湾"], "num": "H", "img": "i6", "kimg": "i4", "ar": 1.157}, {"q": "近畿地方の低地の、古くからの使われ方を答えよ。", "a": "古くから人々の生活の場となってきた。", "r": "", "k": "近畿地方には、南北の山地にはさまれた広い低地が広がっている。この低地は、古い時代から人が住みついてきた土地である。今ではこの地域に、京都・大阪・神戸などの大都市が集まっている。", "choices": ["古くから人々の生活の場となってきた。", "古くから人々が住みつかない場所だった。", "古くから工場が集まる場所となっていた。", "古くから山地が広がる場所となっていた。"], "num": "", "img": "", "kimg": "i4"}, {"q": "近畿地方の低地の現在の特色を答えよ。", "a": "京都・大阪・神戸などの大都市が集中している。", "r": "", "k": "京都・大阪・神戸は、いずれも近畿地方の低地にある都市である。この低地には、人口の多いこうした大都市が集中している。盆地や平野が続くこの地域は、古くから人々の生活の場であった。", "choices": ["京都・大阪・神戸などの大都市が集中している。", "京都・大阪・神戸などの大都市がほとんどない。", "京都・大阪・神戸などの大都市が北部に集中する。", "京都・大阪・神戸などの大都市が南部に集中する。"], "num": "", "img": "", "kimg": "i4"}], "point": {"title": "近畿の中央部の低地", "icon": "ti-map-2", "text": "近畿地方は地形で北部・中央部・南部に分けられる。盆地や平野が広がるのが<span class=\"bl\" data-a=\"中央部\" data-c=\"中央部|北部|南部\"><span class=\"gh\">中央部<span class=\"yomi\">（ちゅうおうぶ）</span></span><span class=\"q\">？</span></sp img": "", "kimg": ""}, {"q": "元に仕え、帰国後に東方見聞録を口述したこの人物はだれか。", "a": "マルコ＝ポーロ", "r": "まるこぽーろ", "k": "マルコ＝ポーロはイタリア商人。元（げん）に仕え、帰国後に東方見聞録（とうほうけんぶんろく）を口述した。", "choices": ["マルコ＝ポーロ", "コロンブス", "バスコ＝ダ＝ガマ", "マゼラン"], "num": "", "img": "i9", "kimg": "", "ar": 1.041}, {"q": "マルコ＝ポーロは何人の商人か。", "a": "イタリア人", "r": "いたりあじん", "k": "マルコ＝ポーロはイタリア人の商人。元（げん）を訪れ、アジアの様子をヨーロッパへ伝えた。", "choices": ["イタリア人", "ポルトガル人", "スペイン人", "オランダ人"], "num": "", "img": "", "kimg": ""}, {"q": "マルコ＝ポーロがアジアで見聞きした内容を帰国後に口述した書物を何というか。", "a": "東方見聞録", "r": "とうほうけんぶんろく", "k": "東方見聞録（とうほうけんぶんろく）は、マルコ＝ポーロがアジアで見聞きした内容を口述した書物。日本を「黄金の国ジパング」と紹介した。", "choices": ["東方見聞録", "大唐西域記", "魏志倭人伝", "日本書紀"], "num": "", "img": "", "kimg": ""}, {"q": "モンゴル軍が日本を襲来したとき、上陸した現在の福岡市の湾はどこか。", "a": "博多湾", "r": "はかたわん", "k": "モンゴル軍は博多湾（はかたわん）に襲来した。鎌倉幕府は九州の御家人（ごけにん）を中心に防衛した。", "choices": ["博多湾", "大阪湾", "伊勢湾", "東京湾"], "num": "", "img": "", "kimg": ""}, {"q": "モンゴル軍の日本襲来に加わった、朝鮮半島の国の軍を何というか。", "a": "高麗軍", "r": "こうらいぐん", "k": "元軍の日本襲来には、服属させられた高麗（こうらい）の軍も加わっていた。", "choices": ["高麗軍", "新羅軍", "百済軍", "南宋軍"], "num": "", "img": "", "kimg": ""}], "point": {"title": "モンゴル帝国から元寇まで", "icon": "ti-building-monument", "text": "<span class=\"bl\" data-a=\"チンギス＝ハン\" data-c=\"チンギス＝ハン|フビライ＝ハン|マルコ＝ポーロ\"><span class=\"gh\">チンギス＝ハン<span class=\"yomi\">（ちんぎすはん）</span></span><span class=\"q\">？</span></span>がモンゴルの諸部族を統一し、1206年にモンゴル帝国<span class=\"yomi\">（もんごるていこく）</span>を建てた。孫の<span class=\"bl\" data-a=\"フビライ＝ハン\" data-c=\"フビライ＝ハン|チンギス＝ハン|北条時宗\"><span class=\"gh\">フビライ＝ハン<span class=\"yomi\">（ふびらいはん）</span></span><span class=\"q\">？</span></span>は中国を支配して国号を元<span class=\"yomi\">（げん）</span>と定め、都を大都<span class=\"yomi\">（だいと）</span>（いまの北京）に置いた。イタリア商人の<span class=\"bl\" data-a=\"マルコ＝ポーロ\" data-c=\"マルコ＝ポーロ|チンギス＝ハン|フビライ＝ハン\"><span class=\"gh\">マルコ＝ポーロ<span class=\"yomi\">（まるこぽーろ）</span></span><span class=\"q\">？</span></span>は元に仕え、帰国後に東方見聞録<span class=\"yomi\">（とうほうけんぶんろく）</span>を口述した。その元が高麗軍<span class=\"yomi\">（こうらいぐん）</span>を加えて日本に攻め、博多湾<span class=\"yomi\">（はかたわん）</span>に上陸する。", "n": 10, "img": "i7"}}]};
var st = {pi:0, qi:0, answered:[], t0:0, combo:0, maxCombo:0, wrong:0};
function $(id){return document.getElementById(id);}
function IMG(id){return (id&&DATA.imgs[id])||'';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function show(id){['scr-point','scr-quiz','scr-done','scr-end'].forEach(function(x){
  var e=$(x); if(e)e.classList.toggle('on', x===id);}); window.scrollTo(0,0);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function nowbar(p,kind){
  return '<div class="nowbar k-gold"><div class="nb-ic"><i class="ti ti-flag"></i></div>'
   +'<div class="nb-b"><div class="nb-k">単元別</div><div class="nb-p">'+esc(p.mtitle)
   +' <small>・ '+esc(p.ptitle)+'</small></div></div></div>';
}
function mkstep(){ $('mk-step').textContent = (st.pi+1)+' / '+DATA.parts.length+' パート'; }

/* ---------- ① 要点 ---------- */
function ptFill(b){b.classList.remove('open');b.classList.add('done');}
function ptSync(card){
  var rest=card.querySelectorAll('.bl:not(.done)').length;
  card.querySelector('.pt-left').textContent = rest?('あと'+rest+'つ'):'';
  card.querySelector('.pt-go .btn').disabled = rest>0;
}
function ptOpen(b){
  var card=b.closest('.pointcard');
  var old=card.querySelector('.pt-pick'); if(old)old.remove();
  Array.prototype.forEach.call(card.querySelectorAll('.bl.open'),function(x){x.classList.remove('open');});
  b.classList.add('open');
  var cs=shuffle((b.dataset.c||'').split('|'));
  var box=document.createElement('div'); box.className='pt-pick';
  box.innerHTML='<div class="pt-pl">〔 ？ 〕に入る<ruby>語句<rt class="uf">ごく</rt></ruby>を<ruby>選<rt class="uf">えら</rt></ruby>ぼう</div><div class="pt-chs">'
    +cs.map(function(c){return '<button class="pt-ch" type="button" data-v="'+esc(c)+'">'+esc(c)+'</button>';}).join('')+'</div>';
  card.querySelector('.pt-body').insertAdjacentElement('afterend',box);
  var msg=card.querySelector('.pt-msg');
  Array.prototype.forEach.call(box.querySelectorAll('.pt-ch'),function(btn){
    btn.onclick=function(){
      Array.prototype.forEach.call(box.querySelectorAll('.pt-ch'),function(x){x.disabled=true;});
      var right=null;
      Array.prototype.forEach.call(box.querySelectorAll('.pt-ch'),function(x){ if(x.dataset.v===b.dataset.a)right=x; });
      if(btn.dataset.v===b.dataset.a){
        btn.classList.add('right');
        if(msg){msg.className='pt-msg ok';msg.textContent='正解！';}
        b.classList.add('hit');
        setTimeout(function(){ ptFill(b); ptAfter(card); },340);
      }else{
        /* バツは出さない。押したのが薄くなって、正しい語が光ってから空欄に入る */
        btn.classList.add('dim');
        if(right)right.classList.add('right');
        if(msg){msg.className='pt-msg re';msg.textContent='こっちだね';}
        setTimeout(function(){ ptFill(b); ptAfter(card); },800);
      }
    };
  });
}
function ptAfter(card){
  ptSync(card);
  var p=card.querySelector('.pt-pick'); if(p)p.remove();
  var nx=card.querySelector('.bl:not(.done)');
  if(nx){ setTimeout(function(){ptOpen(nx);},120); }
  else { var m=card.querySelector('.pt-msg'); if(m){m.className='pt-msg';m.textContent='';} }
}
function renderPoint(){
  var p=DATA.parts[st.pi], pt=p.point;
  $('scr-point').innerHTML = nowbar(p)
   +'<div class="pt-lead"><ruby>要点<rt class="uf">ようてん</rt></ruby></div>'
   +'<div class="pointcard" id="pointcard">'
   +'<div class="pt-h"><div class="pt-ic"><i class="ti '+esc(pt.icon)+'"></i></div><div class="pt-t">'+esc(pt.title)+'</div></div>'
   +(pt.img?'<div class="pt-fig"><img src="'+IMG(pt.img)+'" alt="図" decoding="async"></div>':'')
   +'<div class="pt-body">'+pt.text+'</div><div class="pt-msg"></div><div class="pt-left"></div>'
   +'<div class="pt-meta"><i class="ti ti-stack-2"></i><span>'+pt.n+'問</span></div>'
   +'<div class="pt-go"><button class="btn" id="pt-go"><i class="ti ti-arrow-right"></i> <span>はじめる</span></button></div></div>';
  var card=$('pointcard');
  Array.prototype.forEach.call(card.querySelectorAll('.bl'),function(b){
    b.onclick=function(){ if(!b.classList.contains('done'))ptOpen(b); };});
  ptSync(card);
  var f=card.querySelector('.bl:not(.done)'); if(f)ptOpen(f);
  $('pt-go').onclick=startQuiz;
  show('scr-point'); mkstep();
}

/* ---------- 出題 ---------- */
function startQuiz(){ st.qi=0; st.answered=[]; st.t0=Date.now(); st.combo=0; st.maxCombo=0; st.wrong=0; renderQ(); show('scr-quiz'); }
function renderQ(){
  var p=DATA.parts[st.pi], w=p.words[st.qi], tot=p.words.length;
  var cs=shuffle(w.choices&&w.choices.length?w.choices:[w.a]);
  $('scr-quiz').innerHTML =
    '<div class="prac-top"><button class="prac-quit" type="button"><i class="ti ti-x"></i> <span>やめる</span></button>'
   +'<div class="prac-acts"><button class="prac-refresh" type="button"><i class="ti ti-player-pause"></i> <span class="pr-t">一時停止</span></button>'
   +'<button class="prac-refresh" type="button"><i class="ti ti-refresh"></i> <span class="pr-t">更新</span></button></div></div>'
   + nowbar(p)
   +'<div class="progrow"><div class="prog"><i style="width:'+Math.round(st.qi/tot*100)+'%"></i></div>'
   +'<button class="sofar" id="btn-sofar" type="button"'+(st.answered.length?'':' disabled')+'>'
   +'<i class="ti ti-clipboard-list"></i><span>ここまでの答え</span></button></div>'
   +'<div class="muted center">'+(st.qi+1)+' / '+tot+'問目</div>'
   +'<div class="qwrap">'
   +(w.img?'<div class="imgq-fig" style="height:min(38vh,300px)"><img src="'+IMG(w.img)+'" alt="図" style="position:static;width:100%;height:100%;object-fit:contain"></div>'+figDoneHtml(w):'')
   +'<div class="card"><div class="qlabel">答えを選ぼう</div><div class="qtext">'+esc(w.q)+'</div>'
   +'<div class="qchoices" id="qch">'+cs.map(function(c){
        return '<button class="choice" type="button" data-v="'+esc(c)+'">'+esc(c)+'</button>';}).join('')+'</div></div>'
   +'<div class="explain" id="explain" style="display:none;"><div class="ex-ans" id="ex-ans"></div>'
   +'<div class="ex-kai" id="ex-kai"></div><div id="ex-img"></div><div class="ex-actions">'
   +'<button type="button" class="ex-next" id="ex-next"><i class="ti ti-hand-finger"></i> <span>次へ</span></button></div></div>'
   +'</div>';
  $('btn-sofar').onclick=openSofar;
  Array.prototype.forEach.call($('qch').querySelectorAll('.choice'),function(b){ b.onclick=function(){pick(b,w);}; });
}
function pick(btn,w){
  var ok = btn.dataset.v===w.a;
  Array.prototype.forEach.call($('qch').querySelectorAll('.choice'),function(b){
    b.disabled=true;
    if(b.dataset.v===w.a)b.classList.add('correct');
    else if(b===btn)b.classList.add('wrong');
  });
  st.answered.push({a:w.a, r:w.r, n:w.num||'', miss:!ok, img:w.img});
  if(ok){ st.combo++; if(st.combo>st.maxCombo)st.maxCombo=st.combo; setTimeout(nextQ,420); }
  else{
    st.combo=0; st.wrong++;
    $('ex-ans').innerHTML='<span style="color:#e0574b;font-weight:800;">❌ </span><span class="ex-lbl">正解</span><b>'
      +esc(w.a)+'</b>'+(w.r&&w.r!==w.a?'<span style="font-size:13px;color:var(--sub);font-weight:600;">（'+esc(w.r)+'）</span>':'');
    $('ex-kai').innerHTML=esc(w.k||'');
    $('ex-kai').style.display = w.k?'':'none';
    /* 解説には【解説図】を出す。出題図は記号だけで答えが書いていない（川上さん 2026-09-04）。
       解説図が無い問題には、同じ出題図を使う仲間の解説図を回してある（ビルド側） */
    $('ex-img').innerHTML = w.kimg
      ? '<div class="ex-figl">答えの入った図</div><img src="'+IMG(w.kimg)+'" alt="解説の図" decoding="async">'
      : '';
    $('explain').style.display='';
    $('ex-next').onclick=nextQ;
    $('explain').scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}
function nextQ(){
  var p=DATA.parts[st.pi];
  st.qi++;
  if(st.qi>=p.words.length) renderDone(); else renderQ();
}

/* いま出ている図で、ここまでに答えたものを図の下に出す（押さなくても目に入る） */
function figDoneHtml(w){
  if(!w.img)return '';
  var done=st.answered.filter(function(x){return x.img===w.img;});
  if(!done.length)return '';
  return '<div class="figdone"><span class="fd-l">この図でここまで答えたもの</span>'
    +done.map(function(x){return '<span class="fd-c'+(x.miss?' miss':'')+'">'
      +(x.n?'<b>'+esc(x.n)+'</b>':'')+esc(x.a)+'</span>';}).join('')+'</div>';
}

/* ---------- ② ここまでの答え ---------- */
function openSofar(){
  var p=DATA.parts[st.pi];
  var m=$('sfmask');
  var rows = st.answered.map(function(x,i){
    return '<div class="sf-it'+(x.miss?' miss':'')+'"><span class="sf-no">'+(i+1)+'</span>'
      +'<span class="sf-b"><span class="sf-w">'+esc(x.a)+'</span><span class="sf-r">'+esc(x.r||'')+'</span></span>'
      +(x.miss?'<span class="sf-tag">あとで直す</span>':'')
      +(x.n?'<span class="sf-n">'+esc(x.n)+'</span>':'')+'</div>';
  }).join('');
  m.innerHTML='<div class="sfsheet"><div class="sf-h"><div class="sf-t">ここまでの答え<small>'
    +st.answered.length+'問 ・ '+esc(p.ptitle)+'</small></div><button class="sf-x" type="button">&times;</button></div>'
    +'<div class="sf-list">'+(rows||'<div class="sf-empty">まだ答えがありません</div>')+'</div></div>';
  m.querySelector('.sf-x').onclick=function(){m.classList.remove('on');};
  m.classList.add('on');
}

/* ---------- ③ 完了＋まとめ ---------- */
function sumHtml(){
  var p=DATA.parts[st.pi];
  /* まとめに載せる語を選ぶ。
     ・文で答える問題（答えが「。」で終わる）は用語ではないので外す
     ・同じ答えが2問あるとき（聞き方違い）は1回だけにする */
  var seen={}, use=[];
  p.words.forEach(function(w){
    if(/。$/.test(w.a))return;
    if(seen[w.a])return;
    seen[w.a]=1; use.push(w);
  });
  /* 図ごとにまとめる。図に2問以上ぶら下がる、または1問だけの図が2枚以下＝図＋一覧。
     1問だけの図が3枚以上そろったときだけギャラリー（並べる意味が出る） */
  /* 群のキーは【解説図があれば解説図】。同じ解説図を指す図はひとまとめになる
     （似た地図が3枚縦に並ぶのを防ぐ・2026-09-04） */
  var order=[], byImg={};
  use.forEach(function(w){
    if(!w.img)return;
    var key=w.kimg||w.img;
    if(!byImg[key]){byImg[key]=[];order.push(key);}
    byImg[key].push(w);
  });
  /* 横長の図（地図・グラフ・資料）は小さくすると読めないので、1問でも大きく出す。
     正方形〜縦長の図（肖像・写真）が3枚以上そろったときだけ並べる。 */
  var solo=order.filter(function(u){return byImg[u].length===1 && (byImg[u][0].ar||1)<1.15;});
  var big=order.filter(function(u){return solo.indexOf(u)<0;});
  if(solo.length<3){ big=order.slice(); solo=[]; }
  var none=use.filter(function(w){return !w.img;});
  var h='';
  big.forEach(function(u){
    /* その群に解説図があれば解説図を出す。答えが図に書いてあるので記号は出さない */
    var kai=(byImg[u].find(function(w){return w.kimg;})||{}).kimg||'';
    h+='<div class="sum-grp"><div class="sum-fig"><img src="'+IMG(kai||u)+'" alt="図" loading="lazy" decoding="async"></div>'
      +'<div class="sum-list'+(byImg[u].length===1?' one':'')+'">'+byImg[u].map(function(w){
        return '<div class="sum-it">'+((!kai&&w.num)?'<span class="sum-n">'+esc(w.num)+'</span>':'')
          +'<span class="sum-b"><span class="sum-w">'+esc(w.a)+'</span>'
          +'<span class="sum-r">'+esc(w.r&&w.r!==w.a?w.r:'')+'</span></span></div>';}).join('')+'</div></div>';
  });
  if(solo.length){
    h+='<div class="sum-grp"><div class="sum-gal">'+solo.map(function(u){
      var w=byImg[u][0];
      return '<div class="sum-cell"><div class="ph"><img src="'+IMG(u)+'" alt="'+esc(w.a)+'" loading="lazy" decoding="async"></div>'
        +'<div class="nm">'+esc(w.a)+'</div><div class="rd">'+esc(w.r&&w.r!==w.a?w.r:'')+'</div></div>';}).join('')+'</div></div>';
  }
  if(none.length){
    h+='<div class="sum-other"><div class="sum-ol">そのほかの<ruby>語句<rt class="uf">ごく</rt></ruby></div><div class="sum-chips">'
      +none.map(function(w){return '<span class="sum-chip"><span class="w">'+esc(w.a)+'</span>'
        +(w.r&&w.r!==w.a?'<span class="r">'+esc(w.r)+'</span>':'')+'</span>';}).join('')+'</div></div>';
  }
  return '<div class="sumsec"><div class="shead"><div class="sic"><i class="ti ti-circle-check"></i></div>'
    +'<div class="sb"><div class="st">この<ruby>単元<rt class="uf">たんげん</rt></ruby>の<ruby>用語<rt class="uf">ようご</rt></ruby></div>'
    +'<div class="ss">'+esc(p.ptitle)+' ・ '+use.length+'語</div></div></div>'
    +'<div class="sumcard">'+h+'</div></div>';
}
function fmtDur(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
function renderDone(){
  var p=DATA.parts[st.pi], tot=p.words.length;
  var rate=Math.round((tot-st.wrong)/tot*100);
  var perfect=(st.wrong===0);
  var last=(st.pi>=DATA.parts.length-1);
  $('scr-done').innerHTML =
    '<div class="done-card"><div class="done-ic" style="background:rgba(31,170,107,.13);">'
   +'<i class="ti ti-circle-check" style="color:var(--ok);"></i></div><div class="done-info">'
   +'<div class="done-ttl">'+(perfect?'全問正解！おめでとう':'このパート、終わり！')+'</div>'
   +'<div class="done-nums"><span class="done-score num"><span>'+rate+'</span><small> 点</small></span></div></div></div>'
   +'<div class="dtiles play">'
   +'<div class="dtile ok"><div class="dtl">正答率</div><div class="dtv">'+rate+'<small>%</small></div></div>'
   +'<div class="dtile blue"><div class="dtl">タイム</div><div class="dtv">'+fmtDur(Date.now()-st.t0)+'</div></div>'
   +'<div class="dtile gold"><div class="dtl">コンボ</div><div class="dtv">'+st.maxCombo
   +(perfect?'<span class="dtag">最大！</span>':'')+'</div></div></div>'
   + sumHtml()
   +'<div class="guide-card"><div style="font-size:13px;font-weight:800;margin-bottom:9px;">つぎは？</div>'
   +'<button class="gbtn solid" id="btn-next3"><i class="ti ti-arrow-right"></i> <span>'
   +(last?'終わる':'つぎの単元にすすむ')+'</span></button></div>';
  $('btn-next3').onclick=function(){
    if(last){ show('scr-end'); return; }
    st.pi++; renderPoint();
  };
  show('scr-done'); mkstep();
}

/* ---------- 起動 ---------- */
document.getElementById('mk-furi').onclick=function(){
  document.documentElement.classList.toggle('furi-on'); this.classList.toggle('on');};
document.getElementById('mk-dark').onclick=function(){
  var d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', d?'light':'dark'); this.classList.toggle('on');};
document.getElementById('mk-reset').onclick=function(){ st.pi=0; renderPoint(); };
$('sfmask').onclick=function(e){ if(e.target===this) this.classList.remove('on'); };
renderPoint();
</script>
</body>
</html>
