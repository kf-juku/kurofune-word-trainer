  :root{
    --bg:#f4f5f8;--surface:#fff;--ink:#15161a;--sub:#8a8f99;--line:rgba(0,0,0,.06);
    --accent:#0a6cff;--accent-soft:#e8f0ff;--gold:#caa24a;--ring-track:#e9ecf2;
    --ok:#1faa6b;--ng:#e0533c;--shadow:0 2px 20px rgba(20,24,40,.06);--glass:rgba(255,255,255,.65);--neutral-bg:rgba(0,0,0,.05);--neutral-ic:rgba(0,0,0,.045);
    /* 種類の識別色（川上さん確定 2026-08-20）：毎日学習・単元別＝金／確認テスト＝紫。
       青は「やる・進める」の操作色として空けておく＝タブの識別には使わない。
       使う場所は 帯・本の左線・アイコン・バー・切り替えの番号・「そろそろテスト」タグ だけ。
       合否（緑・赤）と操作ボタン（青）には広げない。 */
    --quiz:#7b5cf0;--quiz-soft:rgba(123,92,240,.13);
    /* 直している最中の色（student-ui-design §19・川上さん確定 2026-08-26）。金＝ごほうびと分ける。
       使うのは ミス問モードのバー と「あと◯問で全問正解」チップの2か所だけ。ライトで --fix を文字色に使わない。 */
    --fix:#e8a317;--fix-soft:#fdf1d6;--fix-ink:#8a6410;
  }
  [data-theme="dark"]{
    --bg:#0d1017;--surface:#161a23;--ink:#eef1f6;--sub:#8b93a3;--line:rgba(255,255,255,.08);
    --accent:#4f8cff;--accent-soft:#15233f;--gold:#e3c477;--ring-track:#252b37;
    --ok:#3ad08a;--ng:#ff6b54;--shadow:0 2px 24px rgba(0,0,0,.4);--glass:rgba(22,26,35,.6);--neutral-bg:rgba(255,255,255,.08);--neutral-ic:rgba(255,255,255,.06);
    --quiz:#a48bff;--quiz-soft:rgba(164,139,255,.16); /* ダークは明るめの紫 2026-08-20 */
    --fix:#ffc94a;--fix-soft:#3a2f14;--fix-ink:#ffc94a; /* 直している最中の黄色 2026-08-26 */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);transition:background .4s,color .4s;overflow-x:hidden;}
  .num{font-family:"Manrope",sans-serif;font-variant-numeric:tabular-nums;}
  .wrap{max-width:430px;margin:0 auto;min-height:100vh;position:relative;}
  .screen{display:none;}.screen.active{display:block;}
  .body{padding:16px 18px 28px;} /* 縦圧縮 2026-07-05 */
  .label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.14em;margin-bottom:9px;display:flex;align-items:center;gap:7px;}
  .daily-bar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 13px;box-shadow:var(--shadow);margin-bottom:12px;}
  .daily-bar .db-t{font-size:13px;font-weight:800;letter-spacing:.02em;}
  .daily-bar .db-n{font-size:13px;font-weight:700;font-family:'Manrope',sans-serif;}
  .daily-bar .db-n.rem{color:var(--ng);}
  /* ===== 新ホーム（二層化・道・単元別フラット・下メニュー）2026-07-24 ===== */
  :root{--n-track:#dfe4ee;--n-goldsoft:rgba(202,162,74,.14);--n-testtint:#fbf7ef;}
  [data-theme="dark"]{--n-track:#2a313f;--n-goldsoft:rgba(227,196,119,.14);--n-testtint:#1b1a15;}
  .nz{margin-bottom:16px;}
  .nz-head{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 9px;}
  .nzh-l{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:700;letter-spacing:-.01em;}
  .nzh-l i{font-size:18px;color:var(--gold);}
  .nz.test .nzh-l i{color:var(--accent);}
  .nzh-sub{font-size:11px;color:var(--sub);font-weight:600;}
  .nz.test{background:var(--n-testtint);border:1px solid var(--line);border-radius:18px;padding:8px 12px 12px;}
  .nz-note{font-size:11px;color:var(--sub);margin:2px 2px 9px;line-height:1.5;}
  /* 毎日学習：今のDAY大＋先プレビュー */
  .dcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 13px;margin-bottom:10px;cursor:pointer;}
  .dcard.primary{border:1.5px solid var(--accent);box-shadow:0 8px 22px rgba(10,79,208,.15);}
  .dcard.done{opacity:.62;}
  .dtop{display:flex;align-items:center;gap:13px;}
  .dnode{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#1c74ff,#0a4fd0);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 5px var(--accent-soft);flex:0 0 auto;}
  .dcard:not(.primary) .dnode{width:46px;height:46px;box-shadow:0 0 0 4px var(--accent-soft);}
  .dnode .dd{font-size:8px;font-weight:700;opacity:.9;line-height:1;letter-spacing:.05em;}
  .dnode .dn{font-size:18px;font-weight:800;font-family:'Manrope',sans-serif;line-height:1.05;}
  .dnode .dni{font-size:22px;}
  .dinfo{flex:1;min-width:0;}
  .dtoprow{display:flex;gap:5px;align-items:center;margin-bottom:2px;flex-wrap:wrap;}
  .npill{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:8px;white-space:nowrap;}
  .npill.daily{background:var(--accent-soft);color:var(--accent);}
  .npill.lap{background:var(--n-goldsoft);color:var(--gold);}
  .npill.sub{background:transparent;color:var(--sub);padding:1px 2px;}
  .dname{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.25;}
  .dsub{font-size:11px;color:var(--sub);margin-top:2px;}
  .dgo{width:34px;height:34px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;}
  .dcard:not(.primary) .dgo{background:var(--accent-soft);color:var(--accent);}
  .dcard.done .dgo{background:var(--n-goldsoft);color:var(--ok);}
  .droad{display:flex;align-items:center;gap:8px;margin:11px 0 1px;padding-left:6px;}
  .droad-lb{font-size:10px;color:var(--sub);font-weight:600;}
  .rdot{width:28px;height:28px;border-radius:50%;border:2px dashed var(--n-track);color:var(--sub);font-size:10px;font-weight:800;font-family:'Manrope',sans-serif;display:flex;align-items:center;justify-content:center;background:var(--bg);}
  .rline{flex:0 0 12px;border-top:2px dotted var(--n-track);}
  .rmore{font-size:11px;color:var(--sub);font-weight:600;}
  /* おさらい行 */
  .nrow{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:11px 13px;margin-bottom:9px;display:flex;align-items:center;gap:11px;cursor:pointer;}
  .nr-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;}
  .nr-nm{flex:1;font-weight:700;font-size:14px;}
  .nr-nm small{display:block;font-weight:500;font-size:10.5px;color:var(--sub);margin-top:1px;}
  .nr-cnt{font-size:12px;color:var(--sub);font-weight:700;white-space:nowrap;}
  .nrow .reddot{position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--ng);} /* 赤●サイズを統一 2026-08-08 */
  /* 間違いノート nudge */
  .nnudge{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,var(--n-goldsoft),transparent);border:1px solid var(--n-goldsoft);border-radius:14px;padding:10px 12px;margin-bottom:9px;cursor:pointer;}
  .nn-ic{width:34px;height:34px;border-radius:10px;background:var(--n-goldsoft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;}
  .nn-b{flex:1;min-width:0;}
  .nn-t{font-weight:700;font-size:13px;}
  .nn-s{font-size:10.5px;color:var(--sub);margin-top:1px;}
  .nn-go{font-size:11.5px;font-weight:800;color:var(--gold);white-space:nowrap;}
  /* 単元別：フラットな章リスト */
  .nbook{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden;}
  .nbook-head{padding:11px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;}
  .nbk-ic{width:34px;height:34px;border-radius:10px;background:var(--n-goldsoft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;}
  .nbk-body{flex:1;min-width:0;}
  .nbk-nm{font-weight:700;font-size:14px;letter-spacing:-.01em;}
  .nbk-meta{font-size:11px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .nbk-subj{font-size:9.5px;color:var(--sub);border:1px solid var(--line);padding:0 6px;border-radius:6px;}
  .nbk-rate{font-weight:700;}
  .nbk-bar{height:4px;border-radius:2px;background:var(--n-track);margin-top:7px;overflow:hidden;}
  .nbk-bar i{display:block;height:100%;background:var(--gold);border-radius:2px;}
  .nbk-arw{color:var(--sub);font-size:19px;transition:transform .2s;}
  .nbook.open .nbk-arw{transform:rotate(180deg);}
  .nbk-detail{display:none;border-top:1px solid var(--line);padding:2px 13px 6px;}
  .nbook.open .nbk-detail{display:block;}
  .nchap{display:flex;align-items:center;gap:9px;padding:10px 0;cursor:pointer;border-bottom:1px solid var(--line);}
  .nchap:last-child{border:none;}
  .ncf-nm{flex:1;font-size:13.5px;font-weight:600;line-height:1.3;}
  .ncf-nm small{display:block;font-weight:500;font-size:10.5px;color:var(--sub);margin-top:1px;}
  .ncf-go{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;}

  /* 流れ星B-2＝星空ステージ＋尾を引く流星2.6秒＋遅れてカード（川上さんモック選定 2026-07-03） */
  .star-stage{background:linear-gradient(160deg,#101830,#1c2a52);border-radius:18px;margin-top:22px;overflow:hidden;padding-bottom:12px;animation:starIn .5s ease;}
  .star-stage .kns-stage{height:220px;border-radius:18px 18px 0 0;} /* 完了画面も三連星と同じ夜の海シーン＝nightSeaStageはheightをJSで持たないので容れ物の高さを与える 2026-07-28 */
  .star-stage .star-sky{position:relative;height:56px;overflow:hidden;} /* 縦圧縮 96→56px（川上さん承認モック 2026-07-05） */
  .bgstar{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 2.6s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.7;}}
  .meteor{position:absolute;top:26%;left:-18%;width:110px;height:2.5px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 60%,#ffe9b0);box-shadow:0 0 8px rgba(255,235,170,.8);opacity:0;animation:shoot2 2.6s .2s cubic-bezier(.2,.7,.4,1) forwards;}
  .meteor::after{content:'';position:absolute;right:-3px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,230,150,.9);}
  .meteor::before{content:'';position:absolute;right:0;top:-8px;width:20px;height:20px;background:radial-gradient(circle,rgba(255,240,190,.5),transparent 70%);border-radius:50%;}
  @keyframes shoot2{0%{opacity:0;transform:translate(0,0) rotate(10deg) scale(.8);}10%{opacity:1;}55%{opacity:1;transform:translate(230px,26px) rotate(10deg) scale(1.15);}100%{opacity:0;transform:translate(480px,52px) rotate(10deg) scale(.9);}}
  .star-stage .star-card{margin:0 12px;background:rgba(15,20,40,.72);border:1px solid rgba(227,196,119,.55);color:#eef1f6;opacity:0;transform:translateY(12px);animation:cardUp .5s 1.5s ease forwards;} /* カメラが夜空を見上げ切ってからカードを出す 2026-07-25／2.7s→1.5s 2026-09-02 */
  /* ★1タップで演出を飛ばしたとき＝カードを即出す（待ち時間0）2026-09-02 */
  .star-stage.skip .kns-cam{animation:none!important;}
  .star-stage.skip .star-card{animation:none;opacity:1;transform:none;}
  @keyframes cardUp{100%{opacity:1;transform:none;}}
  .star-stage .star-nick{color:#fff;}
  .star-stage .star-ach{color:#9aa4bd;}
  .star-stage .star-ava{background:#22304f;color:#ffe9b0;}
  .star-stage .likebtn{background:rgba(255,255,255,.06);border-color:rgba(227,196,119,.45);}
  /* 夜の海＋黒船＋カメラ見上げ（承認モック v2 2026-07-25）：船→上へパン→夜空で流れ星＋さざ波 */
  /* 夜の海シーン（改善 2026-07-28）：縦長・船アップ→高い空へパン→船が消える。位置はJS(layout)で表示窓の高さから計算。パンは --kns-start（下部＝船）→0（上部＝空） */
  .kns-stage{position:relative;height:100%;overflow:hidden;background:#05070f;}
  .kns-cam{position:absolute;left:0;right:0;top:0;height:360px;transform:translate3d(0,var(--kns-start,-180px),0);will-change:transform;backface-visibility:hidden;}
  .kns-cam.pan{animation:knsPan 1.6s cubic-bezier(.42,0,.16,1) forwards;}  /* 3.2s→1.6s 2026-09-02：応援まで待たされて✕を押す子が多かった */
  @keyframes knsPan{0%{transform:translate3d(0,var(--kns-start,-180px),0);}22%{transform:translate3d(0,var(--kns-start,-180px),0);}100%{transform:translate3d(0,0,0);}}
  .kns-sky{position:absolute;left:0;right:0;top:0;height:680px;background:linear-gradient(180deg,#050818 0%,#081026 26%,#0d1836 52%,#132048 72%,#182a58 88%,#1b2e5e 100%);}
  .kns-star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:knsTw 3s infinite ease-in-out;}
  .kns-star.b{width:2.8px;height:2.8px;}
  @keyframes knsTw{0%,100%{opacity:.22;}50%{opacity:.95;}}
  .kns-moon{position:absolute;top:78px;right:44px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 38% 38%,#fff,#f4ecd0 55%,#d9c88f);box-shadow:0 0 26px 7px rgba(244,236,208,.4),0 0 74px 24px rgba(180,190,255,.14);}
  .kns-sea{position:absolute;left:0;right:0;top:470px;height:210px;background:linear-gradient(180deg,#0c1836,#0a1330 45%,#05091c 100%);}
  .kns-sea::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(160,180,255,.4),transparent);}
  .kns-glow{position:absolute;left:50%;transform:translateX(-50%);width:280px;height:160px;border-radius:50%;background:radial-gradient(ellipse at 50% 42%,rgba(188,205,255,.32),rgba(165,188,255,.1) 46%,transparent 70%);filter:blur(7px);pointer-events:none;}
  .kns-refl{position:absolute;top:470px;left:50%;width:22px;height:120px;transform:translateX(30px);background:linear-gradient(180deg,rgba(244,236,208,.5),rgba(244,236,208,0));filter:blur(1px);animation:knsRefl 3.2s infinite ease-in-out;}
  @keyframes knsRefl{0%,100%{opacity:.35;}50%{opacity:.7;}}
  .kns-ship{position:absolute;top:556px;left:50%;width:162px;margin-left:-81px;filter:drop-shadow(0 0 2px rgba(205,220,255,.7)) drop-shadow(0 4px 9px rgba(0,0,0,.5));animation:knsBob 4.5s infinite ease-in-out;transform-origin:50% 90%;}
  @keyframes knsBob{0%,100%{transform:translateY(0) rotate(-1.2deg);}50%{transform:translateY(-3px) rotate(1.2deg);}}
  .kns-meteor{position:absolute;width:4.5px;height:4.5px;border-radius:50%;background:#fff;box-shadow:0 0 16px 4px rgba(255,246,214,.98);opacity:0;}
  .kns-meteor::before{content:'';position:absolute;right:3px;top:50%;width:180px;height:3px;margin-top:-1.5px;background:linear-gradient(90deg,rgba(255,246,214,0),rgba(255,246,214,1));border-radius:2px;}
  .kns-meteor.run{animation:knsShoot 0.9s cubic-bezier(.25,.6,.35,1) forwards;}  /* 1.8s→0.9s 2026-09-02 */
  @keyframes knsShoot{0%{opacity:0;transform:translate(0,0) rotate(27deg);}12%{opacity:1;}82%{opacity:1;}100%{opacity:0;transform:translate(380px,195px) rotate(27deg);}}
  .kns-vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 100px 24px rgba(0,0,0,.5);}
  .t-dusk .kns-glow{background:radial-gradient(ellipse at 50% 42%,rgba(255,190,130,.34),rgba(255,160,90,.1) 46%,transparent 70%);}
  .t-day .kns-glow{opacity:.5;}
  /* ===== 時間帯テーマ（日本時間で自動切替・2026-07-27）：夜=既定(.kns-*)のまま／早朝・昼間・夕暮れだけ色を上書き。流れ星・三連星で共用 ===== */
  .kns-mist{position:absolute;left:-12%;right:-12%;border-radius:50%;filter:blur(7px);display:none;}
  .t-morning .kns-mist{display:block;}
  .kns-mist.m1{top:112px;height:30px;background:rgba(246,242,238,.5);animation:knsMist 15s infinite ease-in-out;}
  .kns-mist.m2{top:150px;height:38px;background:rgba(236,242,248,.55);animation:knsMist 19s infinite ease-in-out reverse;}
  .kns-mist.m3{top:86px;height:22px;background:rgba(248,245,240,.32);animation:knsMist 23s infinite ease-in-out;}
  @keyframes knsMist{0%,100%{transform:translateX(-5%);}50%{transform:translateX(5%);}}
  /* 早朝（6:00–11:00）：涼しい淡色＋霧で早朝感。太陽は白っぽく控えめ */
  .t-morning .kns-sky{background:linear-gradient(180deg,#6f86ad 0%,#93a3c0 30%,#b7bcc8 55%,#d4cbc6 78%,#ecdcc8 100%);}
  .t-morning .kns-star{display:none;}
  .t-morning .kns-moon{top:88px;right:auto;left:22%;width:40px;height:40px;background:radial-gradient(circle at 44% 42%,#ffffff,#fdf4dd 52%,#f2e4bb 100%);box-shadow:0 0 22px 8px rgba(255,250,230,.55),0 0 54px 20px rgba(230,235,245,.2);}
  .t-morning .kns-sea{background:linear-gradient(180deg,#9aa8b4,#6f8090 52%,#42586a);}
  .t-morning .kns-refl{background:linear-gradient(180deg,rgba(255,252,240,.5),rgba(255,252,240,0));}
  .t-morning .kns-vig{box-shadow:inset 0 0 60px 14px rgba(40,52,66,.2);}
  .t-morning .kns-meteor{box-shadow:0 0 9px 2px rgba(255,255,255,.95);}
  .t-morning .kns-meteor::before{background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95));}
  /* 昼間・快晴（11:00–16:00）：雲ひとつない青空＋高く白い太陽 */
  .t-day .kns-sky{background:linear-gradient(180deg,#1f74c8 0%,#3f93de 45%,#79bdf0 80%,#c3e4fb 100%);}
  .t-day .kns-star{display:none;}
  .t-day .kns-moon{top:26px;right:38px;width:42px;height:42px;background:radial-gradient(circle at 42% 40%,#ffffff,#fff6c8 52%,#ffe07a 100%);box-shadow:0 0 30px 10px rgba(255,238,150,.7),0 0 80px 30px rgba(255,240,170,.3);}
  .t-day .kns-sea{background:linear-gradient(180deg,#2f96db,#1f6fb0 55%,#124a7d);}
  .t-day .kns-sea::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);}
  .t-day .kns-refl{display:none;}
  .t-day .kns-vig{box-shadow:inset 0 0 46px 10px rgba(0,20,40,.16);}
  .t-day .kns-meteor{background:#fff;box-shadow:0 0 10px 3px rgba(255,255,255,.98);}
  .t-day .kns-meteor::before{background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.98));}
  /* 夕暮れ（16:00–18:00）：濃い暖色＋大きな夕日でドラマチック */
  .t-dusk .kns-sky{background:linear-gradient(180deg,#2a2350 0%,#6a2f66 30%,#b34350 55%,#ef7e3a 80%,#f9b13f 100%);}
  .t-dusk .kns-star{opacity:.3;}
  .t-dusk .kns-moon{top:70px;right:auto;left:50%;margin-left:-27px;width:54px;height:54px;background:radial-gradient(circle at 46% 44%,#ffe29a,#ff8a34 52%,#df3b26 100%);box-shadow:0 0 34px 12px rgba(255,110,50,.55),0 0 90px 34px rgba(225,60,35,.3);}
  .t-dusk .kns-sea{background:linear-gradient(180deg,#8a3548,#4a2544 50%,#20122f);}
  .t-dusk .kns-refl{background:linear-gradient(180deg,rgba(255,130,70,.6),rgba(255,130,70,0));}
  .t-dusk .kns-vig{box-shadow:inset 0 0 60px 14px rgba(40,8,18,.42);}
  .t-dusk .kns-meteor{box-shadow:0 0 9px 2px rgba(255,196,140,.95);}
  .t-dusk .kns-meteor::before{background:linear-gradient(90deg,rgba(255,196,140,0),rgba(255,196,140,.95));}
  /* 応援ファースト（川上さん承認モック 2026-07-05）：常設コピー＋ラベル付き大ボタン＋送信後の反応 */
  .star-copy{font-size:12.5px;line-height:1.7;color:#c9d2e8;margin:0 0 10px;}
  .star-copy b{color:#fff;}
  .cheer-row{display:flex;gap:10px;margin-top:12px;}
  .cheerbtn{flex:1;border:1px solid rgba(227,196,119,.5);background:rgba(255,255,255,.06);border-radius:15px;padding:11px 4px 9px;color:#e3c477;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;transition:transform .12s,opacity .2s;}
  .cheerbtn svg{width:27px;height:27px;display:block;}
  .cheerbtn .cl{font-size:11px;font-weight:700;}
  .cheerbtn:active{transform:scale(.94);}
  .cheerbtn.sent{background:linear-gradient(135deg,#e3c477,#a9842f);border-color:#e3c477;color:#fff;}
  .cheerbtn.off{opacity:.28;pointer-events:none;}
  .cheer-done{display:none;align-items:center;justify-content:center;gap:7px;margin-top:11px;font-size:13px;font-weight:700;color:#ffe9b0;animation:recvIn .4s ease;}
  .cheer-done.show{display:flex;}
  /* 三連星（前日いちばん頑張った3人）2026-07-25／演出リニューアル2026-07-28：画面いっぱいの夜空・カードが海の上に浮く */
  .trio-ov{position:fixed;inset:0;z-index:200;display:flex;align-items:stretch;justify-content:center;animation:starIn .35s ease;}
  .trio-panel{position:relative;width:100%;max-width:460px;height:100vh;overflow:hidden;background:linear-gradient(180deg,#0d1836 0%,#0a1330 44%,#070d24 72%,#05091c 100%);display:flex;flex-direction:column;}
  .trio-close{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:14px;z-index:6;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;border:none;font-size:18px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .35s ease;}
  /* ★消すボタンは演出が終わって応援できる状態になってから出す。
     出しっぱなしだと、カードが出る前に押して中身を見ないまま消す子が多かった（川上さん 2026-09-02）。 */
  .trio-close.on{opacity:1;pointer-events:auto;}
  .trio-title{position:absolute;top:0;left:0;right:0;z-index:5;color:#fff;text-align:center;padding:calc(env(safe-area-inset-top) + 18px) 16px 6px;text-shadow:0 2px 12px rgba(0,0,0,.7);}
  .trio-title .t1{font-size:13px;color:#ffe9a8;}
  .trio-title .t2{font-size:22px;font-weight:900;margin-top:3px;text-shadow:0 2px 16px rgba(227,196,119,.5);}
  .trio-title .t2 b{color:#ffd873;}
  .trio-scene{position:relative;flex:0 0 auto;height:50vh;min-height:280px;}
  .trio-bottom{position:relative;flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:0 12px calc(env(safe-area-inset-bottom) + 14px);margin-top:-84px;z-index:3;}
  .trio-row{display:flex;gap:9px;align-items:stretch;}
  .tcard{flex:1 1 0;min-width:0;background:rgba(12,18,38,.86);backdrop-filter:blur(4px);border:1px solid rgba(227,196,119,.5);border-radius:18px;padding:14px 8px 13px;text-align:center;color:#eef1f6;opacity:0;transform:translateY(16px);box-shadow:0 14px 38px rgba(0,0,0,.5);}
  .tcard.show{animation:cardUp .5s ease forwards;}
  .trio-row.podium .tcard[data-r="1"]{order:2;border-color:rgba(255,216,115,.8);background:linear-gradient(180deg,rgba(255,216,115,.16),rgba(12,18,38,.86) 52%);box-shadow:0 0 30px rgba(255,216,115,.32),0 14px 38px rgba(0,0,0,.5);padding-top:18px;padding-bottom:16px;}
  .trio-row.podium .tcard[data-r="2"]{order:1;}
  .trio-row.podium .tcard[data-r="3"]{order:3;}
  .tc-rank{font-size:12.5px;font-weight:800;color:#ffd873;}
  .tc-ava{width:58px;height:58px;border-radius:50%;margin:7px auto 5px;display:grid;place-items:center;font-size:27px;font-weight:800;background:#22304f;color:#ffe9b0;}
  /* プロフィールアイコン（OpenMoji SVG・全端末で同じ絵）2026-07-25 */
  .kwt-ico{display:inline-grid;place-items:center;width:100%;height:100%;line-height:0;}
  .kwt-ico svg{width:78%;height:78%;display:block;}
  .h-ava{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;flex-shrink:0;margin-right:8px;overflow:hidden;cursor:pointer;transition:transform .12s;}
  .h-ava:active{transform:scale(.92);}
  .h-ava i{color:var(--sub);font-size:19px;}
  #set-icon .sr-ic{overflow:hidden;}
  #set-icon-ic .kwt-ico svg{width:88%;height:88%;}
  .icgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px;}
  .icpick{position:relative;aspect-ratio:1;border:2px solid var(--line);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:4px;transition:transform .1s,border-color .15s,background .15s;}
  .icpick:active{transform:scale(.94);}
  .icpick .ici{width:36px;height:36px;}
  .icpick .icl{font-size:10px;color:var(--sub);font-weight:700;}
  /* レア度枠（6段階・川上さん確定 2026-07-25）：白→緑→青→紫→金→赤。紫/金/赤は右ほど強く光る */
  :root{--rar1:#5566a0;--rar1s:rgba(85,102,160,.13);--rar1g:rgba(85,102,160,.4);--rar2:#22b26a;--rar2s:rgba(34,178,106,.14);--rar2g:rgba(34,178,106,.5);--rar3:#3d8bff;--rar3s:rgba(61,139,255,.14);--rar3g:rgba(61,139,255,.55);--rar4:#9b5cff;--rar4s:rgba(155,92,255,.15);--rar4g:rgba(155,92,255,.6);--rar5:#e3aa1b;--rar5s:rgba(227,170,27,.16);--rar5g:rgba(245,197,66,.7);--rar6:#ff3a3a;--rar6s:rgba(255,58,58,.16);--rar6g:rgba(255,58,58,.85);}
  [data-theme="dark"]{--rar1:#8ea0d8;--rar1s:rgba(142,160,216,.18);--rar1g:rgba(142,160,216,.42);--rar2:#3ad07f;--rar2s:rgba(58,208,127,.18);--rar2g:rgba(58,208,127,.6);--rar3:#5b9dff;--rar3s:rgba(91,157,255,.18);--rar3g:rgba(91,157,255,.6);--rar4:#b07dff;--rar4s:rgba(176,125,255,.18);--rar4g:rgba(176,125,255,.65);--rar5:#f5c542;--rar5s:rgba(245,197,66,.18);--rar5g:rgba(245,197,66,.75);--rar6:#ff5555;--rar6s:rgba(255,85,85,.2);--rar6g:rgba(255,85,85,.9);}
  .rr1{--rc:var(--rar1);--rs:var(--rar1s);--rg:var(--rar1g);}.rr2{--rc:var(--rar2);--rs:var(--rar2s);--rg:var(--rar2g);}.rr3{--rc:var(--rar3);--rs:var(--rar3s);--rg:var(--rar3g);}.rr4{--rc:var(--rar4);--rs:var(--rar4s);--rg:var(--rar4g);}.rr5{--rc:var(--rar5);--rs:var(--rar5s);--rg:var(--rar5g);}.rr6{--rc:var(--rar6);--rs:var(--rar6s);--rg:var(--rar6g);}
  @keyframes rgGentle{0%,100%{box-shadow:0 0 0 2px var(--rs),0 0 8px 1px var(--rg);}50%{box-shadow:0 0 0 3px var(--rs),0 0 16px 3px var(--rg);}}
  @keyframes rgMed{0%,100%{box-shadow:0 0 0 2px var(--rs),0 0 11px 2px var(--rg);}50%{box-shadow:0 0 0 4px var(--rs),0 0 22px 5px var(--rg);}}
  @keyframes rgStrong{0%,100%{box-shadow:0 0 0 2px var(--rs),0 0 14px 3px var(--rg);}50%{box-shadow:0 0 0 5px var(--rs),0 0 28px 7px var(--rg);}}
  .icpick.rr1,.icpick.rr2,.icpick.rr3{border-color:var(--rc);box-shadow:0 0 0 2px var(--rs);}
  .icpick.rr4{border-color:var(--rc);animation:rgGentle 2.3s infinite ease-in-out;}
  .icpick.rr5{border-color:var(--rc);animation:rgMed 1.9s infinite ease-in-out;}
  .icpick.rr6{border-color:var(--rc);animation:rgStrong 1.5s infinite ease-in-out;}
  .icpick.on{box-shadow:0 0 0 3px var(--ink)!important;}
  .icpick.on .icl{color:var(--ink);}
  .icpick.on::after{content:'✓';position:absolute;top:3px;right:6px;font-size:12px;font-weight:900;color:var(--ink);}
  .badge.rr1,.badge.rr2,.badge.rr3{border-color:var(--rc);box-shadow:0 0 0 2px var(--rs);}
  .badge.rr4{border-color:var(--rc);animation:rgGentle 2.3s infinite ease-in-out;}
  .badge.rr5{border-color:var(--rc);animation:rgMed 1.9s infinite ease-in-out;}
  .badge.rr6{border-color:var(--rc);animation:rgStrong 1.5s infinite ease-in-out;}
  .badge.rr1 .bic,.badge.rr2 .bic,.badge.rr3 .bic,.badge.rr4 .bic,.badge.rr5 .bic,.badge.rr6 .bic{background:var(--rc);color:#fff;}
  .badge.rr1 .bsub,.badge.rr2 .bsub,.badge.rr3 .bsub,.badge.rr4 .bsub,.badge.rr5 .bsub,.badge.rr6 .bsub{color:var(--rc);}
  .badge.locked{border-style:dashed;} /* 未取得＝破線＝取得済み(色つき)と区別 2026-07-28 */
  /* バッジ／アイコンの詳細シート（タップで開く・レア度/入手方法/実績解除/豆知識）2026-07-28 */
  .bd-mask{position:fixed;inset:0;background:rgba(10,16,30,.5);display:none;align-items:flex-end;justify-content:center;z-index:120;}
  .bd-mask.show{display:flex;}
  .bd-sheet{width:100%;max-width:430px;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));animation:bdUp .22s ease;max-height:88vh;overflow:auto;}
  @keyframes bdUp{from{transform:translateY(30px);opacity:.4;}to{transform:none;opacity:1;}}

  .bd-btn.ghost{background:var(--bg);color:var(--sub);margin-top:8px;}
  /* 確認テスト：前回→今回／未実施（再配信後）2026-07-28 */
  .qst{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .qp{font-weight:800;font-size:12px;padding:4px 11px;border-radius:12px;white-space:nowrap;}

  /* まだ受けていない行の3段階（2026-08-20）＝塗り(qp-go)＝いま押すところ／枠(qp-can)＝押せるが今ではない／点線(qp-late)＝練習が先。
     旧 .qp-mada（まだ）・.qp-un（未実施）は使わなくなったが、CSSは残置（他から参照されても崩れないように） */
  .qp-go{background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:4px;}

  .qp-un b{font-size:12px;font-weight:900;}

  .qprev{font-size:10.5px;color:var(--sub);}

  .qprev .qdn{color:var(--ng);font-weight:800;}
  .ach{margin-top:14px;border:1.5px solid var(--rc,var(--line));background:var(--rs,var(--bg));border-radius:14px;padding:12px 14px;}

  .ach-note{font-size:12.5px;color:var(--ink);margin-top:6px;line-height:1.6;}
  .trio-row.podium .tcard[data-r="1"] .tc-ava{width:66px;height:66px;font-size:31px;}
  .tc-nick{font-size:16px;font-weight:800;color:#fff;}
  .trio-row.podium .tcard[data-r="1"] .tc-nick{color:#ffe9a8;font-size:17px;}
  .tc-eff{font-size:13px;color:#ffe9a8;font-weight:800;margin-top:4px;}
  .tc-eff b{color:#ffd873;}
  .tc-sub{font-size:10.5px;color:#9aa4bd;margin-top:3px;line-height:1.4;}
  .tc-sub .tsub-seg{white-space:nowrap;} /* 「連続2日」「いつもの4.5倍」「昨日19問」を語の途中で改行しない。折り返すのは「・」の所だけ 2026-07-28 */
  .tc-sub .tsub-dot{color:#6b7690;margin:0 3px;}
  .tcheer{margin-top:10px;width:100%;border:1px solid rgba(227,196,119,.55);background:rgba(255,255,255,.08);border-radius:13px;padding:10px 4px;color:#e3c477;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:800;display:block;text-align:center;line-height:1.3;transition:transform .12s;}
  .tcheer .tch-l{display:inline;white-space:normal;} /* ラベルは1かたまり＝「特別/応援」が1文字ずつ縦に散らばるのを防ぐ（狭い端末対策）2026-07-28 */
  .tcheer:active{transform:scale(.95);}
  .tcheer.sent{background:linear-gradient(135deg,#e3c477,#a9842f);border-color:#e3c477;color:#fff;pointer-events:none;}
  /* 自分の強調は「シアン系（きみ色）」＝金色(1位)と被らせない 2026-07-26 */
  .tcard.me{border-color:#5fd0ff!important;background:rgba(95,208,255,.16)!important;box-shadow:0 0 22px rgba(95,208,255,.28)!important;}
  .tcard.me .tc-ava{background:linear-gradient(135deg,#9fe6ff,#3aa6e0);color:#04283c;}
  .tc-mebadge{margin-top:9px;width:100%;border-radius:12px;padding:8px 2px;background:rgba(95,208,255,.22);color:#eafaff;font-size:11px;font-weight:800;}
  .trio-foot{color:#cdd6e6;font-size:12.5px;text-align:center;margin-top:12px;padding:0 16px;line-height:1.7;}
  /* フッターと「始める」ボタンも、カードと同じタイミングで出す（先に出ていると読む前に押して消える）2026-09-02 */
  .trio-foot,.trio-cta{opacity:0;pointer-events:none;transition:opacity .35s ease;}
  .trio-bottom.on .trio-foot,.trio-bottom.on .trio-cta{opacity:1;pointer-events:auto;}
  .trio-foot b{color:#ffd873;}
  .trio-cta{display:block;margin:12px auto 0;background:#fff;color:#15161a;border:none;border-radius:12px;padding:12px 28px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;}
  .trio-heart{position:absolute;font-size:17px;pointer-events:none;animation:heartUp .9s ease forwards;z-index:7;}
  @keyframes heartUp{0%{opacity:0;transform:translateY(0) scale(.6);}20%{opacity:1;}100%{opacity:0;transform:translateY(-42px) scale(1.2);}}
  /* 受け取った応援の通知（ホーム） */
  .star-recv{display:flex;align-items:center;gap:8px;background:rgba(202,162,74,.12);border:1px solid var(--gold);border-radius:14px;padding:11px 14px;margin-bottom:14px;font-size:14px;font-weight:700;color:var(--ink);}
  /* 受信リスト（川上さん確定 2026-07-03 grill：送り主つき直近10件） */
  .recv{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);animation:recvIn .4s ease both;}
  .recv .rav{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
  .recv .rtext{flex:1;font-size:13px;min-width:0;}
  .recv .rtext b{font-weight:700;}
  .recv .rstamp{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--gold);background:rgba(202,162,74,.13);border-radius:20px;padding:2px 9px;vertical-align:middle;}
  .recv .rstamp svg{width:14px;height:14px;display:block;}
  .recv .rwhen{font-size:10.5px;color:var(--sub);flex-shrink:0;}
  @keyframes recvIn{0%{opacity:0;transform:translateX(-6px);}100%{opacity:1;transform:none;}}
  #recv-list{margin-bottom:14px;}
  .star-recv i{color:var(--gold);font-size:20px;}
  /* 一番星（三連星の特別応援を受け取った別枠メダル）2026-07-25 */
  .ich-recv{background:linear-gradient(160deg,rgba(227,196,119,.16),rgba(227,196,119,.03));border:1px solid rgba(227,196,119,.5);border-radius:16px;padding:14px;margin-bottom:14px;}
  .ich-medal{display:flex;align-items:center;gap:13px;}
  .ich-star{width:50px;height:50px;flex:0 0 auto;border-radius:50%;background:linear-gradient(135deg,var(--gold),#a9842f);display:grid;place-items:center;color:#241905;box-shadow:0 0 20px rgba(227,196,119,.35);}
  .ich-star i{font-size:26px;}
  .ich-n{font-size:13px;color:var(--gold);font-weight:800;}
  .ich-v{font-family:'Manrope';font-weight:800;font-size:24px;color:var(--ink);line-height:1.1;}
  .ich-v small{font-size:12px;color:var(--sub);font-weight:700;margin-left:3px;}
  .ich-s{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.5;}
  .ich-list{margin-top:10px;padding-top:10px;border-top:1px solid rgba(227,196,119,.25);font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .ich-from{background:rgba(227,196,119,.14);color:var(--gold);border-radius:20px;padding:2px 9px;font-weight:700;}
  /* ===== ホーム再構成（2026-07-02）応援ポップ／学習行／全体カード ===== */
  .star-pop{display:flex;align-items:center;gap:8px;background:rgba(202,162,74,.14);border:1px solid var(--gold);border-radius:13px;padding:8px 12px;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;transition:transform .12s;}
  /* 仲間チル演出（川上さん確定 2026-07-03：今日の仲間ニックネーム／朝は前日実績・きらめき粒ON・音なし） */
  .chill{display:flex;align-items:center;gap:8px;padding:4px 0 2px;overflow:hidden;position:relative;opacity:0;}
  .chill.show{animation:chillIn 1.4s ease forwards;}
  @keyframes chillIn{0%{opacity:0;transform:translateY(6px);}100%{opacity:1;transform:none;}}
  .chill .avs{display:flex;flex-shrink:0;}
  .chill .av{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;border:2px solid var(--surface);margin-left:-7px;}
  .chill .av:first-child{margin-left:0;}
  .chill .ctext{font-size:12px;font-weight:500;line-height:1.5;color:var(--sub);}
  .chill .ctext b{font-weight:700;color:var(--ink);}
  .chill .spark{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:0;animation:sparkFloat 4s ease-in-out infinite;}
  @keyframes sparkFloat{0%{opacity:0;transform:translateY(8px);}30%{opacity:.7;}70%{opacity:.4;}100%{opacity:0;transform:translateY(-14px);}}
  .star-pop:active{transform:scale(.99);}
  .star-pop i:first-child{color:var(--gold);font-size:19px;}
  .star-pop .sp-txt{flex:1;}
  .star-pop .sp-arw{color:var(--sub);font-size:18px;}
  .learn-row{position:relative;display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:9px 13px;box-shadow:var(--shadow);margin-top:10px;cursor:pointer;transition:transform .15s;}
  .learn-row:active{transform:scale(.99);}
  .learn-row .lr-ic{width:30px;height:30px;border-radius:11px;background:var(--neutral-ic);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
  .learn-row .lr-nm{flex:1;font-size:14px;font-weight:700;}
  .learn-row .lr-cnt{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);}
  .learn-row .lr-cnt .tdot{min-width:20px;height:20px;padding:0 5px;border-radius:11px;background:var(--ng);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;}
  .learn-row .lr-cnt .tdot.on{display:inline-flex;}
  /* 赤丸統一（川上さん指示 2026-07-05）：デイリー未完了＝カード右上の赤丸（数字なし）に一本化 */
  .reddot{position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--ng);z-index:2;}
  .learn-row.dim{opacity:.55;} /* おさらい0件は薄く（川上さん承認 2026-07-05） */
  .overall-card{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:9px 13px;box-shadow:var(--shadow);margin-top:10px;}
  .overall-card .oc-ic{width:30px;height:30px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
  .overall-card .oc-nm{flex:1;font-size:14px;font-weight:700;}
  .overall-card .oc-stats{display:flex;gap:16px;}
  .overall-card .oc-st{text-align:center;}
  .overall-card .oc-st .v{font-family:"Manrope";font-weight:800;font-size:16px;}
  .overall-card .oc-st .k{font-size:10px;color:var(--sub);margin-top:1px;}
  @keyframes likeBounce{0%{transform:scale(1);}35%{transform:scale(1.45);}60%{transform:scale(.85);}100%{transform:scale(1);}}
  .likebtn.bounce{animation:likeBounce .45s ease;}
  @keyframes chkPop{0%{transform:scale(0);}60%{transform:scale(1.25);}100%{transform:scale(1);}}
  .spark{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:5;}

  /* 練習 */
  .prac-top{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin:-4px 0 6px;border-bottom:1px solid var(--line);}
  /* 学習中の帯＝いま何をやっているか（A-1・川上さん確定 2026-08-21）。色は識別色そのまま＝student-ui-design §18-1。押す対象ではない（カードにしない） */
  .nowbar{display:flex;align-items:center;gap:10px;margin:6px 0 2px;padding:0 2px;}
  .nowbar .nb-ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;}
  .nowbar .nb-b{flex:1;min-width:0;}
  .nowbar .nb-k{font-size:11px;font-weight:800;letter-spacing:.02em;}

  .nowbar .nb-p small{font-weight:500;color:var(--sub);font-size:11px;}
  .nowbar.k-gold .nb-ic{background:var(--n-goldsoft);color:var(--gold);}
  .nowbar.k-gold .nb-k{color:var(--gold);}
  .nowbar.k-quiz .nb-ic{background:var(--quiz-soft);color:var(--quiz);}
  .nowbar.k-quiz .nb-k{color:var(--quiz);}
  .nowbar.k-accent .nb-ic{background:var(--accent-soft);color:var(--accent);}
  .nowbar.k-accent .nb-k{color:var(--accent);}
  /* 【確定・2026-08-28 川上さん＝案C-1】枠も面も作らない。文字を濃く・アイコンを大きく・高さ44px。
     旧＝color:var(--sub) は背景とのコントラストが 3.0:1（読める最低ライン4.5:1を下回る）で、
     枠も面も無いため「押せるもの」に見えず、生徒が気づけなかった。
     ただし枠や面を足すと .card（問題）や .choice（選択肢）と同じ見た目になって野暮ったくなるので、
     箱は作らず濃さと大きさだけで見せる。下の1本線で「ここは操作の帯」と示す。 */
  .prac-quit,.prac-refresh{background:none;border:none;color:var(--ink);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;padding:10px 8px;min-height:44px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;}
  .prac-quit i,.prac-refresh i{font-size:18px;color:var(--ink);opacity:.5;}
  .prac-quit:hover,.prac-refresh:hover{background:var(--ring-track);}
  .prac-quit:active,.prac-refresh:active{opacity:.5;}
  .prac-acts{display:flex;align-items:center;gap:14px;}
  /* ラベルは途中で割らない（「やめ／る」と2行になると読みにくい）。狭い端末では余白と字を詰めて1行に収める */
  .prac-quit span,.prac-refresh span{white-space:nowrap;}
  @media (max-width:340px){
    .prac-quit,.prac-refresh{padding:10px 6px;gap:4px;font-size:12.5px;}
    .prac-quit i,.prac-refresh i{font-size:17px;}
    .prac-acts{gap:8px;}
  }
  /* 一時停止（2026-08-20）：問題を読ませないよう背景を濃くぼかす。中身は既存の .modal を流用 */
  .modal-mask.pausing{background:rgba(10,14,22,.94);align-items:center;}
  /* ふりがな表示（小学生）のとき、モーダルのルビが本文に重ならないよう行間を広げる。中学生の見た目は変えない 2026-08-20 */
  html.furi-on .modal h3{line-height:1.9;}
  html.furi-on .modal .hint{line-height:2.1;}
  .modal-mask.pausing .modal{border-radius:22px;max-width:340px;margin:0 18px;text-align:center;padding:26px 20px;}
  .modal-mask.pausing .pz-ic{display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:44px;line-height:1;}
  /* 止まっていることが絵で分かるように、グレーで止めた制限時間バーを添える（数字・説明文は出さない）2026-08-20 */
  .pz-bar{width:120px;height:10px;border-radius:8px;background:var(--ring-track);margin:14px auto 2px;overflow:hidden;}
  .pz-bar i{display:block;height:100%;width:55%;border-radius:8px;background:var(--sub);opacity:.55;}
  .progrow{display:flex;align-items:center;gap:8px;}
  .prog{flex:1;min-width:0;height:8px;background:var(--ring-track);border-radius:6px;overflow:hidden;margin:8px 0 6px;}
  /* ミス問モードのチップ「あと◯問で全問正解」2026-08-26。日本語は span で1つに包む（flex直下に裸で置かない） */
  .fixchip{flex:none;display:flex;align-items:center;gap:5px;background:var(--fix-soft);color:var(--fix-ink);font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;}
  .fixchip i{font-size:13px;}
  .fixchip b{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;}
  /* 1問あたりの制限時間バー（案C・太バー＋残り秒数・色変化）2026-07-04 */
  .qtimer{display:flex;align-items:center;gap:10px;margin:10px 0 4px;}
  .qbar{flex:1;height:12px;background:var(--ring-track);border-radius:8px;overflow:hidden;}
  .qbar i{display:block;height:100%;width:100%;border-radius:8px;background:var(--accent);}
  .qsec{font-size:15px;font-weight:700;min-width:44px;text-align:right;color:var(--accent);}
  /* 不正解時の 解答＋解説＋タップでつぎへ（2026-07-04）*/
  .explain{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ng);border-radius:14px;padding:11px 13px;margin-top:4px;box-shadow:var(--shadow);animation:exIn .18s ease;}
  @keyframes exIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .ex-ans{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .ex-ans b{color:var(--ok);}
  /* 「正解」は漢字の小さめラベル＝答えの用語の読みがなと誤読させない（ひらがな「せいかい」だと読みがなに見える）2026-07-26 */
  .ex-ans .ex-lbl{display:inline-block;font-size:11px;font-weight:800;color:var(--sub);background:rgba(31,170,107,.12);border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px;}
  .ex-kai{font-size:13.5px;line-height:1.6;color:var(--sub);margin-bottom:7px;}
  /* 解説なぞり（不正解時・下線が伸びる）2026-07-26：文字は最初から読める色のまま、読み進む所に金の下線が流れる＝目で追わせる。次へボタンには何もしない（目線を奪わない） */
  .ex-kai.trace{color:var(--ink);}
  .ex-kai .kc{transition:background-color .12s linear;border-radius:3px;}
  .ex-kai .kc.read{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:3px;}
  .ex-kai .kc.cur{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:3px;background-color:rgba(202,162,74,.20);}
  .ex-actions{display:flex;gap:9px;margin-top:12px;}
  .ex-next{flex:1;background:var(--accent);color:#fff;border:0;border-radius:13px;padding:14px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;cursor:pointer;position:relative;overflow:hidden;}
  .ex-next i{font-size:19px;}
  .ex-next.waiting{background:var(--ring-track);color:var(--sub);cursor:default;}
  .ex-report{flex:none;background:var(--surface);color:var(--ng);border:1.5px solid var(--ng);border-radius:13px;padding:0 13px;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;font-family:inherit;cursor:pointer;line-height:1.2;}
  .prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s;}
  .prog>i.fix{background:var(--fix);}
  .word-en{font-size:42px;font-weight:700;text-align:center;letter-spacing:-.01em;margin:14px 0 4px;}
  .reading{text-align:center;color:var(--sub);margin-bottom:14px;}
  /* 読み仮名（国語）＋四角空欄 2026-07-14 */
  #j2e-ja ruby rt,.choice ruby rt{font-size:.5em;color:var(--sub);font-weight:500;line-height:1;}
  /* UI文言のふりがな（学年で出し分け）2026-07-22：既定は非表示＝中学生は漢字だけ。小学生(html.furi-on)だけルビ表示。国語の問題文ruby(#j2e-ja/.choice)とは class=uf で分離 */
  rt.uf{display:none;}
  html.furi-on rt.uf{display:revert;font-size:.55em;color:var(--sub);font-weight:500;line-height:1;}
  ruby{ruby-align:center;}
  .qblank{display:inline-block;min-width:2.6em;height:1.15em;border:2px solid var(--accent,#3b6ef0);border-radius:5px;background:rgba(59,110,240,.10);margin:0 4px;vertical-align:-3px;}
  .furi-bar{display:none;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border:1px solid rgba(10,108,255,.28);border-radius:14px;padding:8px 12px;margin:2px 0 12px;position:relative;}
  .furi-bar .fb-lbl{font-size:13px;color:var(--accent);font-weight:800;display:inline-flex;align-items:center;gap:6px;}
  .furi-bar .fb-lbl .fb-ic{width:22px;height:22px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12.5px;color:var(--accent);font-weight:800;}
  .furi-bar .fb-seg{display:flex;background:var(--surface);border:1px solid rgba(10,108,255,.28);border-radius:999px;overflow:hidden;}
  .furi-bar .fb-tg{border:0;background:transparent;color:var(--sub);padding:7px 13px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;}
  .furi-bar .fb-tg.on{background:var(--accent);color:#fff;}
  .furi-coach{position:absolute;right:10px;top:-11px;background:#111827;color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;white-space:nowrap;z-index:4;}
  .furi-coach::after{content:'';position:absolute;right:20px;bottom:-5px;border:5px solid transparent;border-top-color:#111827;border-bottom:0;}
  .choice{display:flex;align-items:center;justify-content:center;width:100%;padding:17px;font-family:inherit;font-size:18px;margin-bottom:12px;border:1px solid var(--line);border-radius:15px;background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .1s;}
  .choice:active{transform:scale(.98);}
  .choice.correct{border-color:var(--ok);background:rgba(31,170,107,.12);color:var(--ok);font-weight:700;animation:pop .35s;}
  .choice.wrong{border-color:var(--ng);background:rgba(224,83,60,.12);color:var(--ng);animation:shake .3s;}
  .choice:disabled{cursor:default;}
  /* 川上さん承認(2026-07-05 モック)：4択は最長選択肢が10文字以内なら2×2グリッド、超えたら1列 */
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .g2 .choice{margin-bottom:0;min-height:56px;padding:12px 10px;font-size:17px;text-align:center;line-height:1.45;}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.06);}100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  .combo{position:fixed;top:16%;left:50%;transform:translateX(-50%);font-family:"Manrope";font-size:34px;font-weight:800;color:var(--gold);opacity:0;pointer-events:none;z-index:60;}
  .combo.show{animation:comboPop .8s ease-out;}
  @keyframes comboPop{0%{opacity:0;transform:translateX(-50%) scale(.5);}30%{opacity:1;transform:translateX(-50%) scale(1.15);}100%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(1);}}
  /* 間違いノート：卒業ポップ（解答中・中央）＋卒業単語カード（採点後）2026-07-13 */
  .gradpop{position:fixed;top:34%;left:50%;transform:translateX(-50%) scale(.6);opacity:0;z-index:65;pointer-events:none;background:linear-gradient(135deg,var(--gold),#a9842f);color:#fff;border-radius:18px;padding:14px 22px;box-shadow:0 10px 30px rgba(202,162,74,.45);text-align:center;white-space:normal;max-width:min(340px,calc(100vw - 44px));box-sizing:border-box;} /* 長い用語でも画面からはみ出さない：折り返し可＋最大幅（拡大アニメのピークscale1.1でもはみ出さない幅）2026-07-23 */
  .gradpop.show{animation:gradPop 2.4s cubic-bezier(.2,1.3,.4,1) forwards;} /* 読めるように表示時間を延長 2026-07-23 */
  .gradpop .gp-em{font-size:26px;line-height:1;}
  .gradpop .gp-w{font-size:19px;font-weight:800;margin-top:3px;font-family:'Manrope';line-height:1.35;word-break:break-word;overflow-wrap:anywhere;}
  .gradpop .gp-ja{font-size:13px;font-weight:600;opacity:.92;margin-left:3px;font-family:'Noto Sans JP';}
  .gradpop .gp-l{font-size:12px;font-weight:700;opacity:.95;margin-top:1px;}
  @keyframes gradPop{0%{opacity:0;transform:translateX(-50%) scale(.6);}7%{opacity:1;transform:translateX(-50%) scale(1.08);}14%{transform:translateX(-50%) scale(1);}85%{opacity:1;transform:translateX(-50%) scale(1);}100%{opacity:0;transform:translateX(-50%) translateY(-20px) scale(.97);}}
  .note-saving{margin-top:12px;}
  .grad-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow);margin-top:12px;animation:riseIn .5s ease-out;}
  @keyframes riseIn{0%{opacity:0;transform:translateY(10px);}100%{opacity:1;transform:translateY(0);}}
  .grad-h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;margin-bottom:11px;}
  .grad-h i{color:var(--gold);font-size:18px;}
  .grad-cap{margin-left:auto;font-size:11px;color:var(--sub);font-weight:500;}
  .gword{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);margin-bottom:8px;animation:gwIn .45s both;}
  .gword:last-child{margin-bottom:0;}
  .gword .gw-chk{width:26px;height:26px;border-radius:50%;background:rgba(31,170,107,.15);color:var(--ok);display:grid;place-items:center;font-size:15px;flex:none;}
  .gword .gw-en{font-weight:700;font-size:15px;}
  .gword .gw-ja{font-size:12px;color:var(--sub);margin-left:auto;text-align:right;}
  @keyframes gwIn{0%{opacity:0;transform:translateX(-8px);}100%{opacity:1;transform:translateX(0);}}
  .note-none{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-top:12px;text-align:center;color:var(--sub);font-size:12.5px;line-height:1.7;}
  /* 【2026-08-26】display:block のアイコンは margin auto で中央に。マスク方式は要素の幅が1emなので text-align:center では寄らない */
  .note-none i{font-size:24px;color:var(--gold);display:block;margin:0 auto 5px;}
  .err{color:var(--ng);font-size:14px;margin-bottom:8px;min-height:18px;}
  .loading{text-align:center;color:var(--sub);padding:30px;}
  .loading.sm{padding:4px 0 10px;font-size:11.5px;} /* スケルトンの上に添える小さい版 2026-08-21⑭ */

  /* 完了画面の縦圧縮（川上さん承認モック 2026-07-05）：トロフィー・文言・点数・率を1枚に横組み */
  .done-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);}
  .done-ic{width:54px;height:54px;border-radius:50%;background:rgba(202,162,74,.13);display:grid;place-items:center;font-size:30px;flex:none;animation:badgeIn .6s cubic-bezier(.2,1.4,.4,1);}
  @keyframes badgeIn{0%{transform:scale(0) rotate(-18deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
  .done-info{flex:1;min-width:0;}
  .done-ttl{font-size:16.5px;font-weight:700;line-height:1.35;}
  .done-nums{display:flex;align-items:baseline;gap:8px;margin-top:3px;flex-wrap:wrap;}
  .done-score{font-family:"Manrope";font-size:29px;font-weight:800;}
  .done-score small{font-size:12px;color:var(--sub);font-weight:500;font-family:"Noto Sans JP";}
  /* 完了3タイル（正答率/タイム/最大コンボ）2026-07-24 */
  .dtiles{display:flex;gap:9px;margin:12px 0 2px;}
  .dtile{flex:1;border-radius:15px;padding:0 0 9px;text-align:center;border:1.5px solid transparent;overflow:hidden;opacity:0;transform:scale(.82) translateY(8px);}
  .dtiles.play .dtile{animation:dtilePop .5s cubic-bezier(.2,1.3,.5,1) forwards;}
  .dtiles.play .dtile:nth-child(1){animation-delay:.05s;}
  .dtiles.play .dtile:nth-child(2){animation-delay:.19s;}
  .dtiles.play .dtile:nth-child(3){animation-delay:.33s;}
  @keyframes dtilePop{to{opacity:1;transform:none;}}
  .dtile .dtl{font-size:10px;font-weight:700;padding:4px 0;margin-bottom:7px;color:#fff;}
  .dtile .dtv{font-family:"Manrope";font-weight:800;font-size:19px;line-height:1;}
  .dtile .dtv small{font-size:10.5px;font-weight:600;}
  .dtile .dtag{display:inline-block;font-family:"Noto Sans JP";font-size:9.5px;font-weight:800;margin-left:3px;padding:1px 5px;border-radius:999px;background:var(--gold);color:#3a2c07;vertical-align:1px;}
  .dtile.gold{background:rgba(202,162,74,.12);border-color:rgba(202,162,74,.4);} .dtile.gold .dtl{background:var(--gold);} .dtile.gold .dtv{color:var(--gold);}
  .dtile.ok{background:rgba(31,170,107,.12);border-color:rgba(31,170,107,.4);} .dtile.ok .dtl{background:var(--ok);} .dtile.ok .dtv{color:var(--ok);}
  .dtile.blue{background:rgba(10,108,255,.10);border-color:rgba(10,108,255,.34);} .dtile.blue .dtl{background:var(--accent);} .dtile.blue .dtv{color:var(--accent);}
  /* 完了バッジ 3層＝役割色で背景も連動（途中=青/完了=緑/大きな達成=金）2026-08-08 */
  .done-ic.dib-gold{background:rgba(202,162,74,.14);} .done-ic.dib-ok{background:rgba(31,170,107,.14);} .done-ic.dib-accent{background:rgba(10,108,255,.12);}
  /* 完了画面の「次の一手」共通カード＋ボタン（塗り青=主役／薄い青=副）2026-08-08 */
  .guide-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 15px;margin-top:14px;text-align:left;}
  .guide-h{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:7px;margin-bottom:9px;}
  .guide-h i{color:var(--gold);}
  .gstack{display:flex;flex-direction:column;gap:8px;}
  .gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;border:none;}
  .gbtn.solid{background:var(--accent);color:#fff;}
  .gbtn.soft{background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);padding:10px;font-size:13px;}
  .gsub{font-size:11.5px;color:var(--sub);text-align:center;margin-top:7px;}
  /* 連続記録カード（記録タブ常設＆お祝い共通）2026-07-24 */
  .stk-rec{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px 12px 12px;margin-bottom:14px;}
  .stk-card{text-align:center;padding:4px 4px 2px;}
  .stk-flame{width:90px;height:90px;margin:2px auto 2px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 50% 42%,rgba(202,162,74,.24),rgba(202,162,74,.04));}
  .stk-flame i{font-size:46px;color:var(--gold);position:relative;z-index:2;}
  .stk-flame .stk-glow{position:absolute;inset:0;border-radius:50%;z-index:1;}
  .stk-num{font-family:"Manrope";font-weight:800;font-size:42px;line-height:1;color:var(--gold);}
  .stk-lbl{font-size:11.5px;color:var(--sub);letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:3px;}
  .stk-msg{font-size:12.5px;color:var(--sub);margin:11px 6px 2px;line-height:1.6;}
  .stk-msg b{color:var(--ink);}
  .stk-freeze{margin:10px auto 2px;font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 12px;display:inline-flex;align-items:center;gap:5px;}
  .stk-freeze b{font-size:14px;}
  .stk-plus{display:inline-flex;align-items:center;gap:2px;background:var(--gold);color:#3a2c07;font-family:"Manrope";font-weight:800;font-size:13px;padding:2px 9px;border-radius:999px;margin-top:7px;}
  .stk-plus i{color:#3a2c07;font-size:13px;}
  /* ホーム復帰のお祝い（オーバーレイ）*/
  .stk-cele-mask{position:fixed;inset:0;z-index:70;background:rgba(15,17,26,.55);display:none;align-items:center;justify-content:center;padding:26px;}
  .stk-cele-mask.show{display:flex;}
  .stk-cele{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px 18px 18px;position:relative;transform:translateY(-16px) scale(.94);opacity:0;}
  .stk-cele-mask.show .stk-cele{animation:stkIn .5s cubic-bezier(.2,1.2,.4,1) forwards;}
  @keyframes stkIn{to{opacity:1;transform:none;}}
  .stk-cele .stk-close{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;z-index:5;}
  .stk-cele-mask.show .stk-flame i{animation:stkFlame 1.4s ease-out .25s 2;}
  @keyframes stkFlame{0%{transform:scale(1);}30%{transform:scale(1.26) rotate(-3deg);}55%{transform:scale(.96);}75%{transform:scale(1.12);}100%{transform:scale(1);}}
  .stk-cele-mask.show .stk-glow{animation:stkGlow 1.3s ease-out .25s 2;}
  @keyframes stkGlow{0%{box-shadow:0 0 0 0 rgba(202,162,74,.5);}100%{box-shadow:0 0 0 30px rgba(202,162,74,0);}}
  .done-rate{font-size:11.5px;color:var(--sub);}
  .done-miss{font-size:11.5px;color:var(--sub);margin-top:3px;}
  .btnrow{display:flex;gap:10px;margin-top:8px;}
  .done-guide{display:inline-block;margin-top:5px;font-size:12px;color:var(--sub);font-weight:600;line-height:1.5;} /* 前進条件の案内 2026-07-07 */
  .btnrow .btn{padding:11px;font-size:13.5px;}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50;}
  .conf{position:absolute;width:10px;height:14px;top:-20px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9;}}
  /* 花火（おさらい完了：中心から粒が飛び散る1発を時間差で複数＝ボンボンボン）2026-07-26。背景は画面のまま＝テーマ追従、上に重ねるだけ */
  .fw-spark{position:fixed;width:8px;height:8px;border-radius:50%;opacity:0;z-index:60;pointer-events:none;}
  @keyframes fwBurst{0%{opacity:1;transform:translate(0,0) scale(1);}80%{opacity:1;}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.35);}}
  .flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(202,162,74,.4),transparent 60%);opacity:0;pointer-events:none;z-index:40;}
  .flash.show{animation:flash .5s;}
  @keyframes flash{0%{opacity:0;}30%{opacity:1;}100%{opacity:0;}}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:24px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70;}
  .toast.show{opacity:1;}
  /* 演出の登場直後、貯まっていた先行タップを一定時間すべて飲み込む透明レイヤー（要件：しっかり見えてからのタップで消す/押すのはOK）2026-07-25 */
  .tap-guard{position:fixed;inset:0;z-index:9999;background:transparent;}

/* ===== 先生からのお知らせ（一斉指示）2026-08-28 =====
   正＝機能仕様書_一斉指示_Kurofune-Word-Trainer.md §6
   色は既存の役割色だけ（青＝操作色）。新しい色は足さない（student-ui-design §12）。 */
.ntc-mask{position:fixed;inset:0;z-index:9998;display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(8,11,18,.74);}
.ntc-mask.show{display:flex;}
.ntc-card{width:100%;max-width:392px;max-height:84vh;display:flex;flex-direction:column;
  background:var(--surface);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.42);
  padding:20px 18px 18px;animation:ntcIn .3s cubic-bezier(.2,.9,.3,1.2) both;}
@keyframes ntcIn{from{opacity:0;transform:translateY(16px) scale(.95);}to{opacity:1;transform:none;}}
.ntc-top{flex:none;display:flex;align-items:center;justify-content:center;gap:9px;}
.ntc-ic{width:36px;height:36px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;}
.ntc-ttl{font-size:14px;font-weight:700;color:var(--accent);}
.ntc-sub{flex:none;margin-top:7px;text-align:center;font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;}
.ntc-body{flex:1 1 auto;min-height:0;overflow-y:auto;margin:16px 0 0;padding:0 2px 14px;
  font-size:18px;line-height:1.85;font-weight:500;color:var(--ink);white-space:pre-wrap;
  word-break:break-word;-webkit-overflow-scrolling:touch;}
.ntc-line{flex:none;height:1px;background:var(--line);margin-bottom:14px;}
.ntc-card .btn{flex:none;width:100%;padding:15px;font-size:15.5px;}
.ntl{display:flex;flex-direction:column;gap:10px;}
.ntl-row{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:13px 14px;box-shadow:var(--shadow);}
.ntl-d{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;margin-bottom:6px;}
.ntl-b{font-size:14.5px;line-height:1.8;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
.ntl-chk{margin-top:9px;display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ok);font-weight:600;}
.ntl-chk i{font-size:14px;}
.ntl-chk em{font-style:normal;color:var(--sub);font-weight:400;}

/* ===== 紙の答え合わせ（仕上げプリント 段5）2026-09-01 ===== */
.sh-lead{font-size:13px;line-height:1.8;color:var(--sub);margin-bottom:12px;}
.sh-in{display:flex;gap:8px;align-items:center;}

.imgq-track span{min-width:26px;height:26px;padding:0 4px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:800;font-family:'Manrope','Noto Sans JP',sans-serif;background:var(--ring-track);color:var(--sub)}
.imgq-track span.cur{background:var(--accent);color:#fff;animation:tfpulse 1.2s infinite}
.imgq-track span.done{background:rgba(31,170,107,.18);color:var(--ok)}
  /* 幾何学スピナー（kurofune-testから流用・KWT色。川上さん指示2026-07-06：待ちのストレス軽減） */
  @keyframes kwtldspin{to{transform:rotate(360deg);}}
  @keyframes kwtldrspin{to{transform:rotate(-360deg);}}
  .kwtld{display:inline-block;vertical-align:middle;}
  .kwtld .o{animation:kwtldspin 2.4s linear infinite;transform-origin:50% 50%;}
  .kwtld .i{animation:kwtldrspin 1.7s linear infinite;transform-origin:50% 50%;}
  /* ===== バグ報告（各画面から押せる）2026-07-11 ===== */
  .bug-fab{position:fixed;right:16px;bottom:20px;z-index:70;display:flex;align-items:center;gap:7px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:26px;padding:10px 15px 10px 12px;box-shadow:0 6px 22px rgba(20,24,40,.18);cursor:pointer;font-family:inherit;}
  body.on-home .bug-fab{bottom:82px;}/* 下メニューと重ならないよう ホームでは上げる 2026-07-24 */
  .bug-fab i{font-size:19px;color:var(--accent);}
  .bug-fab span{font-size:13px;font-weight:700;}
  .bug-fab:active{transform:translateY(2px);}
  .bug-fab.dim{opacity:.2;transition:opacity .15s;}
  /* 羅針盤アドバイザーを右下の一等地に置くので、不具合報告は左下の小アイコンに退避（大ボタンを2つ並べない）2026-07-26 */
  .bug-fab{right:auto;left:max(14px, calc(50vw - 201px));padding:10px;border-radius:50%;}/* 中央寄せ430px列の左端に合わせる（大画面で端に飛ぶのを防ぐ）2026-07-26 */
  .bug-fab span{display:none;}
  /* ===== 羅針盤アドバイザー（総括・全タブ常駐フローター＋パネル）2026-07-26 ===== */
  .rb-float{position:fixed;right:max(14px, calc(50vw - 201px));bottom:20px;z-index:71;width:60px;height:60px;cursor:pointer;filter:drop-shadow(0 8px 16px rgba(13,24,48,.4));animation:rbBob 3.4s ease-in-out infinite;display:none;}/* 中央寄せ430px列の右端に合わせる 2026-07-26 */
  @keyframes rbBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  /* 初回（その日はじめて）だけ出す吹き出し。開いたら消す 2026-07-26 */
  .rb-bubble{position:absolute;right:66px;bottom:12px;background:#15161a;color:#fff;font-size:12px;font-weight:800;padding:8px 12px;border-radius:13px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.28);animation:rbPop .3s ease;}
  .rb-bubble:after{content:'';position:absolute;right:-6px;bottom:15px;border:6px solid transparent;border-left-color:#15161a;}
  @keyframes rbPop{from{opacity:0;transform:translateX(6px) scale(.9)}to{opacity:1;transform:none}}
  /* いまの学習のようす＝多軸（三連星の評価軸を流用） */
  .rb-statuscard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;}
  .rb-axis{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .rb-axis:last-child{border-bottom:none;}
  .rb-axis>i{color:var(--accent);font-size:18px;width:20px;text-align:center;flex:0 0 auto;}
  .rb-axis .ax-l{color:var(--sub);font-weight:800;font-size:11.5px;flex:0 0 62px;}
  .rb-axis .ax-v{color:var(--ink);line-height:1.5;}
  .rb-praise-line{font-size:13px;color:var(--sub);line-height:1.7;padding:11px 13px;background:var(--accent-soft);}
  .rb-trend{padding:12px 13px;border-top:1px solid var(--line);}
  .rb-trend-t{font-size:11.5px;font-weight:800;color:var(--sub);margin-bottom:9px;}
  .rb-bars{display:flex;align-items:flex-end;gap:8px;height:64px;}
  .rb-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;}
  .rb-bar .rb-bv{font-size:10px;color:var(--sub);font-weight:700;font-family:Manrope,sans-serif;}
  .rb-bar i{width:100%;max-width:26px;border-radius:5px 5px 0 0;display:block;}
  .rb-mask{position:fixed;inset:0;z-index:120;background:rgba(6,9,18,.55);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center;}
  .rb-mask.show{display:flex;}
  .rb-panel{width:100%;max-width:440px;background:var(--surface);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;animation:rbUp .3s ease;position:relative;}
  @keyframes rbUp{from{transform:translateY(34px);opacity:.5}to{transform:translateY(0);opacity:1}}
  .rb-head{background:radial-gradient(circle at 22% 18%,#22345f,#0b1424);color:#fff;padding:16px 16px 15px;display:flex;align-items:center;gap:12px;}
  .rb-head .nm{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.05em;}
  .rb-head .hello{font-size:15.5px;font-weight:800;margin-top:3px;line-height:1.35;}
  .rb-close{position:absolute;top:12px;right:13px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;border:none;font-size:16px;cursor:pointer;z-index:3;}
  .rb-body{padding:15px 15px 20px;}
  .rb-sec-t{font-size:11.5px;font-weight:800;color:var(--sub);letter-spacing:.03em;margin:2px 2px 7px;}
  .rb-change{background:var(--accent-soft);border-radius:14px;padding:11px 13px;margin-bottom:14px;}
  .rb-change .ci{font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px;padding:3px 0;}
  .rb-change .ci i{color:var(--accent);font-size:15px;}
  .rb-praise{font-size:13.5px;color:var(--ink);line-height:1.7;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:14px;box-shadow:var(--shadow);}
  .rb-praise p{margin:0 0 6px;}.rb-praise p:last-child{margin:0;}
  .rb-next{background:linear-gradient(135deg,#22345f,#0b1424);color:#fff;border-radius:16px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:12px;}
  .rb-next .rn-ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .rb-next .rn-ic i{font-size:22px;color:var(--gold);}
  .rb-next .rn-lbl{font-size:11px;color:var(--gold);font-weight:800;}
  .rb-next .rn-ttl{font-size:16px;font-weight:800;margin-top:1px;}
  .rb-next .rn-why{font-size:12px;color:rgba(255,255,255,.8);margin-top:2px;}
  .rb-next .rn-go{margin-left:auto;font-size:20px;color:#fff;}
  .bug-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .bug-chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:13.5px;font-family:inherit;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;}
  .bug-chip .tk{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line);display:inline-grid;place-items:center;font-size:11px;color:#fff;}
  .bug-chip.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700;}
  .bug-chip.sel .tk{background:var(--accent);border-color:var(--accent);}
  .bug-field{margin-bottom:16px;}
  .bug-field>label{font-size:13px;font-weight:700;display:block;margin:0 0 8px;}
  .bug-field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--ink);}
  .bug-lbl{font-size:13px;font-weight:700;display:block;margin:0 0 8px;}
  .bug-lbl .opt{font-size:11.5px;color:var(--sub);font-weight:500;margin-left:4px;}
  .bug-ta{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--ink);resize:vertical;min-height:60px;margin-bottom:16px;}
</style>
<style>
/* ===== モック用のわく（本番には出ません） ===== */
.mkbar{position:sticky;top:0;z-index:70;background:#15161a;color:#fff;padding:7px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;}
.mkbar b{font-size:11px;font-weight:800;letter-spacing:.04em;opacity:.75;}
.mkbtn{background:rgba(255,255,255,.13);color:#fff;border:none;border-radius:8px;padding:6px 9px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;}
.mkbtn.on{background:#e8a317;color:#1a1304;}
.mkstep{margin-left:auto;font-size:10.5px;opacity:.7;}
.screen{display:none;} .screen.on{display:block;}

/* ===== ① 要点 ===== */
.pt-lead{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--sub);margin:14px 2px 6px;}
.pointcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 16px 14px;}
.pt-h{display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.pt-h .pt-ic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;background:var(--n-goldsoft);color:var(--gold);}
.pt-h .pt-t{font-size:14.5px;font-weight:800;letter-spacing:-.01em;}
.pt-fig{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:11px;min-height:190px;display:flex;align-items:center;justify-content:center;}
.pt-fig img{display:block;width:100%;max-height:190px;object-fit:contain;}
.pt-body{font-size:14px;line-height:2.15;font-weight:500;}
.pt-body .yomi{font-size:10.5px;color:var(--sub);font-weight:600;}
.bl{position:relative;display:inline-flex;align-items:center;justify-content:center;line-height:1.55;padding:0 8px;margin:0 2px;border-radius:7px;background:var(--accent-soft);border:1.5px dashed var(--accent);color:var(--accent);font-weight:800;cursor:pointer;vertical-align:1px;}
.bl .gh{visibility:hidden;white-space:nowrap;}
.bl .q{position:absolute;left:0;right:0;text-align:center;}
.bl.open{background:var(--accent);color:#fff;border-style:solid;}
.bl.done{background:none;border-color:transparent;border-bottom-color:var(--ring-track);border-bottom-style:solid;color:var(--ink);cursor:default;border-radius:0;}
.bl.done .gh{visibility:visible;} .bl.done .q{display:none;} .bl.done .yomi{color:var(--sub);}
.bl.shake{animation:blShake .3s;}
@keyframes blShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* 当たったのか外したのかが分かるように（2026-09-04 川上さん指摘）。
   外したときもバツは出さない。正しい語が光ってから空欄に入る。 */
.bl.hit{animation:blHit .8s ease-out;}
@keyframes blHit{0%{background:rgba(31,170,107,.28);border-color:var(--ok);}
  55%{background:rgba(31,170,107,.16);border-color:rgba(31,170,107,.5);}
  100%{background:none;border-color:transparent;}}
.pt-ch.dim{opacity:.3;}
.pt-ch.right{border-color:var(--ok);background:rgba(31,170,107,.12);color:var(--ok);animation:pop .35s;}
.pt-msg{margin-top:9px;font-size:12.5px;font-weight:800;min-height:18px;}
.pt-msg.ok{color:var(--ok);} .pt-msg.re{color:var(--fix-ink);}
.pt-pick{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.pt-pl{font-size:11px;font-weight:800;color:var(--sub);margin-bottom:8px;}
.pt-chs{display:flex;flex-wrap:wrap;gap:8px;}
.pt-ch{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;min-height:44px;}
.pt-ch:active{transform:translateY(1px);}
.pt-left{font-size:11.5px;font-weight:700;color:var(--sub);margin-top:11px;}
.pt-meta{display:flex;align-items:center;gap:7px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);font-weight:600;}
.pt-meta i{font-size:15px;opacity:.7;} .pt-meta span{white-space:nowrap;}
.pt-go{margin-top:12px;} .pt-go .btn:disabled{opacity:.4;cursor:default;}

/* ===== ② ここまでの答え ===== */
.sofar{flex:none;display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--ink);font-family:inherit;font-size:11.5px;font-weight:700;padding:6px 4px;min-height:34px;border-radius:9px;cursor:pointer;}
.sofar i{font-size:15px;color:var(--ink);opacity:.5;}
.sofar span{white-space:nowrap;} .sofar:active{opacity:.5;} .sofar:disabled{opacity:.3;cursor:default;}
.sfmask{position:fixed;inset:0;z-index:80;background:rgba(10,14,22,.5);display:none;align-items:flex-end;justify-content:center;}
.sfmask.on{display:flex;}
.sfsheet{width:100%;max-width:430px;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:76vh;display:flex;flex-direction:column;}
.sf-h{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
.sf-h .sf-t{flex:1;min-width:0;font-size:15px;font-weight:800;}
.sf-h .sf-t small{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-top:1px;}
.sf-x{flex:none;background:none;border:none;color:var(--ink);opacity:.55;font-size:22px;line-height:1;padding:6px;cursor:pointer;}
.sf-list{overflow:auto;-webkit-overflow-scrolling:touch;}
.sf-it{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);}
.sf-it:last-child{border-bottom:none;}
.sf-no{flex:0 0 auto;width:22px;text-align:right;font-family:'Manrope',sans-serif;font-weight:700;font-size:12px;color:var(--sub);}
.sf-b{flex:1;min-width:0;}
.sf-w{display:block;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sf-r{display:block;font-size:10.5px;color:var(--sub);font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sf-n{flex:0 0 auto;min-width:24px;height:24px;padding:0 5px;border-radius:8px;background:var(--ring-track);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.sf-it.miss{background:var(--fix-soft);border-radius:10px;border-bottom-color:transparent;}
.sf-it.miss .sf-w{color:var(--fix-ink);}
.sf-it.miss .sf-n{background:rgba(232,163,23,.22);color:var(--fix-ink);}
.sf-tag{flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--fix-ink);white-space:nowrap;}
.sf-empty{padding:22px 6px;text-align:center;color:var(--sub);font-size:13px;}

/* ===== ③ おぼえたもの ===== */
.sumsec{margin-top:14px;}
.sumsec .shead .sic{background:rgba(31,170,107,.13);color:var(--ok);}
.sumcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:13px;}
.sum-grp+.sum-grp{margin-top:13px;padding-top:13px;border-top:1px solid var(--line);}
.sum-fig{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:11px;}
.sum-fig img{display:block;width:100%;max-height:230px;object-fit:contain;}
.sum-list.one{grid-template-columns:1fr;}
.sum-list{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px;}
.sum-it{display:flex;align-items:center;gap:7px;min-width:0;}
.sum-n{flex:0 0 auto;min-width:22px;height:22px;padding:0 4px;border-radius:7px;background:var(--ring-track);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;}
.sum-b{flex:1;min-width:0;}
.sum-w{display:block;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sum-r{display:block;font-size:10px;color:var(--sub);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sum-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.sum-cell{min-width:0;text-align:center;}
.sum-cell .ph{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;}
.sum-cell .ph img{width:100%;height:100%;object-fit:cover;display:block;}
.sum-cell .nm{font-size:12px;font-weight:700;margin-top:5px;line-height:1.3;}
.sum-cell .rd{font-size:9.5px;color:var(--sub);font-weight:600;line-height:1.3;}
.sum-other{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.sum-ol{font-size:11px;font-weight:800;color:var(--sub);margin-bottom:8px;}
.sum-chips{display:flex;flex-wrap:wrap;gap:7px;}
.sum-chip{background:var(--ring-track);border-radius:12px;padding:6px 11px;text-align:center;}
.sum-chip .w{display:block;font-size:12.5px;font-weight:700;line-height:1.3;}
.sum-chip .r{display:block;font-size:9.5px;color:var(--sub);font-weight:600;line-height:1.3;}
@media (max-width:330px){ .sum-list{grid-template-columns:1fr;} }

/* 出題中：いま出ている図で、ここまでに答えたものを図の下に置く。
   押さなくても目に入るので「さっき同じ名前なかったっけ」がその場で解ける（2026-09-04 川上さん）。
   まだ答えていないものは出ないので答えバレしない。 */
.figdone{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 2px 0;}
.figdone .fd-l{font-size:10.5px;font-weight:800;color:var(--sub);width:100%;}
.figdone .fd-c{display:inline-flex;align-items:center;gap:5px;background:var(--ring-track);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;}
.figdone .fd-c b{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 3px;border-radius:5px;background:var(--surface);font-size:10.5px;}
.figdone .fd-c.miss{background:var(--fix-soft);color:var(--fix-ink);}
/* 解説図。本番の .ex-fig は display:flex の別部品なので、こちらは自前の枠に当てる */
#ex-img img{display:block;width:100%;max-width:100%;max-height:240px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#fff;}
.ex-figl{font-size:10.5px;font-weight:800;color:var(--sub);margin:9px 0 5px;}

/* 出題まわり（本番のクラスをそのまま使う。足りないぶんだけ） */
.qwrap{margin-top:10px;}
.qchoices{display:grid;gap:9px;margin-top:14px;}
.qlabel{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:7px;}
.qtext{font-size:16px;font-weight:700;line-height:1.75;}
.endcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 18px;text-align:center;margin-top:16px;}
.endcard .ei{width:56px;height:56px;border-radius:50%;background:rgba(202,162,74,.14);color:var(--gold);display:grid;place-items:center;font-size:30px;margin:0 auto 12px;}
</style>
</head>
<body>
<div class="mkbar">
  <b>通しモック</b>
  <button class="mkbtn" id="mk-reset" type="button">最初から</button>
  <button class="mkbtn" id="mk-furi" type="button">ふりがな</button>
  <button class="mkbtn" id="mk-dark" type="button">ダーク</button>
  <span class="mkstep" id="mk-step"></span>
</div>
<div class="wrap"><div class="body" style="padding-bottom:70px;">
  <section class="screen" id="scr-point"></section>
  <section class="screen" id="scr-quiz"></section>
  <section class="screen" id="scr-done"></section>
  <section class="screen" id="scr-end">
    <div class="endcard"><div class="ei"><i class="ti ti-trophy"></i></div>
      <div style="font-size:18px;font-weight:800;">3単元、終わり！</div>
      <div style="font-size:13px;color:var(--sub);margin-top:8px;line-height:1.7;">
        中1地理・中2地理・歴史を1パートずつ通してやってみた形です。<br>
        上の「最初から」でもう一度できます。</div></div>
  </section>
</div></div>
